<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PQN — دائرتك الخاصة</title>
<meta name="theme-color" content="#0B1320"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
:root{
  --navy:#0B1320;--navy2:#122236;--navy3:#1c2c44;
  --teal:#27B8AE;--teal2:#57D7CF;--tealdeep:#0f6e56;--amber:#D9A441;--rose:#C85C5C;
  --bg:#e7f1f0;--surface:#ffffff;--surface2:#eef5f4;--text:#0f1d2b;--muted:#5b6f7c;
  --line:rgba(20,40,55,.12);
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.42);--glassln:rgba(255,255,255,.7);--blur:20px;
  --soft:0 8px 26px rgba(11,30,45,.08);--shadow:0 24px 60px rgba(11,30,45,.20);
  --r:18px;--r2:14px;--font:"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;color-scheme:light}
body.dark{
  --bg:#071019;--surface:#0f2030;--surface2:#152a3c;--text:#e9f5f4;--muted:#9fb6c1;
  --line:rgba(233,243,243,.12);
  --glass:rgba(18,36,52,.55);--glass2:rgba(18,36,52,.4);--glassln:rgba(255,255,255,.09);
  --soft:0 8px 26px rgba(0,0,0,.35);--shadow:0 24px 60px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{background-color:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--text);min-height:100vh;background:
  radial-gradient(1200px 560px at 86% -14%,rgba(39,184,174,.22),transparent 60%),
  radial-gradient(900px 480px at -14% 8%,rgba(87,215,207,.16),transparent 55%),
  radial-gradient(760px 420px at 50% 116%,rgba(217,164,65,.10),transparent 55%),
  var(--bg);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{display:block}
.icn{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.icn.sm{width:18px;height:18px}.icn.lg{width:26px;height:26px}

/* ===== auth ===== */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:100%;max-width:400px;text-align:center;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glassln);border-radius:26px;box-shadow:var(--shadow);padding:30px 22px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:900;font-size:27px;margin-bottom:6px;letter-spacing:.5px}
.qmark{position:relative;width:42px;height:42px;border:3px solid var(--teal);border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 6px rgba(39,184,174,.1)}
.qmark::after{content:"";position:absolute;bottom:6%;left:-12%;width:38%;height:14%;border-radius:99px;background:var(--teal);transform:rotate(42deg)}
.qmark i{position:absolute;top:34%;width:14%;height:14%;border-radius:50%;background:var(--teal2)}.qmark i:first-child{right:30%}.qmark i:last-child{right:52%}
.tag{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.7}
.field{margin-bottom:14px;text-align:right}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;min-height:54px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);outline:none;font-size:16px;text-align:center;box-shadow:var(--soft)}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(39,184,174,.18)}
.priv{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.8}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 16px;border-radius:var(--r2);font-weight:800;font-size:15px;border:1px solid transparent;transition:transform .12s ease,box-shadow .2s ease}
.btn.full{width:100%}
.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#04312e;box-shadow:0 12px 28px rgba(39,184,174,.36)}
.primary:active{transform:translateY(1px) scale(.99)}
.secondary{background:rgba(39,184,174,.14);color:var(--tealdeep);border-color:rgba(39,184,174,.32)}
.btn.soft{background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(200,92,92,.14);color:var(--rose);border:1px solid rgba(200,92,92,.32)}
.hidden{display:none!important}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:rgba(11,19,32,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#eafaf8;padding:12px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1);z-index:999;max-width:90%;box-shadow:var(--shadow);text-align:center;border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== shell ===== */
.shell{display:none;max-width:540px;margin:0 auto;min-height:100vh;position:relative;background:transparent}
body.in .shell{display:flex;flex-direction:column;height:100dvh}body.in .center{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);border-bottom:1px solid var(--glassln);color:var(--text)}
.top h1{margin:0;font-size:17px;font-weight:900}.top .sub{font-size:11px;color:var(--muted);margin-top:2px}
.grow{flex:1;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tealdeep);font-weight:700;background:rgba(39,184,174,.14);padding:6px 11px;border-radius:99px;border:1px solid rgba(39,184,174,.25)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,184,174,.5)}70%{box-shadow:0 0 0 7px rgba(39,184,174,0)}100%{box-shadow:0 0 0 0 rgba(39,184,174,0)}}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;padding-bottom:108px}

/* ===== glass cards ===== */
.card{background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glassln);border-radius:var(--r);box-shadow:var(--soft);padding:15px;margin-bottom:13px}
.greet{font-size:19px;font-weight:900;margin:2px 2px 14px}.greet span{color:var(--tealdeep)}
.hero{background:linear-gradient(150deg,var(--navy2),var(--navy3));color:#eafaf8;border:0;text-align:center;padding:18px}
.hero .lbl{font-size:12px;color:#a9bccb;margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#04312e;background:linear-gradient(135deg,var(--teal),var(--teal2));flex:0 0 auto;box-shadow:0 6px 14px rgba(39,184,174,.28)}
.av.g{background:linear-gradient(135deg,var(--amber),#eac374);color:#5a3d05;box-shadow:0 6px 14px rgba(217,164,65,.28)}
.nm{font-weight:800;font-size:14.5px}.mut{color:var(--muted);font-size:12.5px;margin-top:2px}
.pin{direction:ltr;display:inline-block;padding:11px 18px;border-radius:12px;background:rgba(255,255,255,.14);color:#eafaf8;font-weight:800;letter-spacing:2px;font-size:19px;cursor:pointer}
.strip{padding:11px 13px;border-radius:12px;background:rgba(39,184,174,.1);color:var(--tealdeep);border:1px solid rgba(39,184,174,.22);font-size:12px;line-height:1.6;margin-bottom:12px}
.warn{background:rgba(217,164,65,.14);color:#7a560a;border-color:rgba(217,164,65,.3)}
body.dark .warn{color:#ffd98a}
.field2{margin-bottom:12px}.field2 label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field2 input,.field2 textarea,.field2 select{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);outline:none;font-size:15px}
.field2 textarea{resize:vertical;min-height:80px;line-height:1.6}
.field2 input:focus,.field2 textarea:focus,.field2 select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(39,184,174,.12)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px;line-height:1.7}
.shead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.shead h3{margin:0;font-size:15px;font-weight:900;display:flex;align-items:center;gap:7px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(39,184,174,.14);color:var(--tealdeep);font-size:11px;font-weight:800}
.acts{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px;min-width:38px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;font-weight:700;color:var(--text)}
.chip.on{background:var(--teal);color:#04312e;border-color:transparent;box-shadow:0 6px 16px rgba(39,184,174,.3)}
.chip.secondary{background:rgba(39,184,174,.12);color:var(--tealdeep);border-color:rgba(39,184,174,.3)}
.chip.ping{background:rgba(217,164,65,.16);border-color:rgba(217,164,65,.34);font-size:15px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:transform .12s}
.swatch.on{box-shadow:0 0 0 3px rgba(39,184,174,.5);transform:scale(1.05)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--tealdeep);font-weight:900}.stat span{font-size:10.5px;color:var(--muted)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.tg:last-child{border-bottom:0}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.22s;flex:0 0 auto}
.sw.on{background:var(--teal)}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on::after{right:23px}

/* ===== chat ===== */
.thread{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 14px 11px;border-radius:18px 18px 18px 6px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glassln);font-size:13.5px;line-height:1.6;position:relative;transition:transform .12s ease;animation:bubIn .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes bubIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,rgba(39,184,174,.22),rgba(87,215,207,.16));border-color:rgba(39,184,174,.3);border-radius:18px 18px 6px 18px}
.bub .sn{display:block;font-size:10.5px;font-weight:800;color:var(--tealdeep);margin-bottom:2px}
.bub .t{display:block;font-size:10px;color:var(--muted);margin-top:4px;text-align:end}
.bub .reply{position:absolute;top:4px;left:4px;opacity:0;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;font-size:12px;color:var(--muted);cursor:pointer;transition:opacity .15s}
.bub:hover .reply{opacity:1}
.bub .quote{display:block;border-inline-start:3px solid var(--teal);background:rgba(39,184,174,.1);padding:5px 9px;border-radius:8px;font-size:11.5px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub .lock{font-size:10px;opacity:.7;margin-inline-end:3px}
.bub .rr{color:var(--teal);font-weight:800}
.bub .exp{color:var(--amber);font-size:9.5px;margin-inline-end:5px}
.bub.burn{background:rgba(200,92,92,.12);border-color:rgba(200,92,92,.3)}
.burntxt{color:var(--rose);font-weight:600}
.replybar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:9px 13px;border:1px solid var(--line);border-inline-start:3px solid var(--teal);border-radius:var(--r2);background:var(--glass2)}
.replybar .rp{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer}
.encb{font-size:11px;cursor:pointer;vertical-align:middle}
.pingmsg{align-self:center;background:rgba(217,164,65,.16);color:#7a560a;border:1px solid rgba(217,164,65,.3);padding:7px 15px;border-radius:99px;font-size:12px;font-weight:700}
body.dark .pingmsg{color:#ffd98a}
.composer{display:flex;align-items:center;gap:6px;margin-top:12px;padding:8px;border:1px solid var(--glassln);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--soft)}
.composer input{border:0;outline:0;background:transparent;font-size:14px;padding:8px;min-width:0;flex:1 1 auto}
.cb{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#04312e;font-size:18px;flex:0 0 auto;transition:transform .12s}
.cb:active{transform:scale(.92)}
.cb.mini{width:38px;height:38px;background:var(--surface2);color:var(--text);font-size:18px}
.composer .cb{width:42px;height:42px}.composer .cb.mini{width:38px;height:38px;font-size:17px}
.cb.ghost{background:rgba(217,164,65,.18);color:#7a560a}
body.dark .cb.ghost{color:#ffd98a}
body.recording .cb.rec{background:var(--rose);color:#fff;animation:pulse 1.1s infinite}
.emoji{display:none;flex-wrap:wrap;gap:3px;max-height:150px;overflow-y:auto;padding:8px;border:1px solid var(--glassln);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));margin-top:8px}
.emoji.show{display:flex}
.emoji button{font-size:21px;background:none;border:0;padding:4px;line-height:1;cursor:pointer}
.imgmsg img{max-width:220px;max-height:270px;border-radius:12px;display:block;cursor:pointer}
.voicebtn{background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.34);border-radius:11px;padding:9px 13px;font-weight:700;font-size:13px;color:#7a560a}
body.dark .voicebtn{color:#ffd98a}
.chatwrap{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:0 0 auto}
.idbtn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);padding:6px 10px;border-radius:14px;color:var(--text)}
.idbtn:active{transform:scale(.98)}
.idbtn .av{flex:0 0 auto;width:38px;height:38px;border-radius:12px}
.chatwrap .thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:6px}
.chatwrap .composer{flex:0 0 auto;margin:6px 0 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}

/* ===== floating glass nav ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 24px);max-width:472px;display:grid;gap:2px;padding:8px;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--glassln);border-radius:22px;box-shadow:var(--shadow);z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 1px;border-radius:14px;color:var(--muted);font-size:10px;font-weight:700;transition:.18s;position:relative}
.nav button .icn{width:23px;height:23px;transition:.18s}
.nav button.on{color:var(--tealdeep)}
.nav button.on .icn{stroke:var(--teal);transform:translateY(-1px)}
.nav button.on::before{content:"";position:absolute;inset:0;background:rgba(39,184,174,.14);border-radius:14px;z-index:-1;animation:navpop .25s ease}
@keyframes navpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* ===== banner / modal ===== */
.banner{position:fixed;left:50%;top:10px;transform:translateX(-50%) translateY(-140%);width:calc(100% - 24px);max-width:496px;z-index:200;display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:16px;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);color:var(--text);box-shadow:var(--shadow);cursor:pointer;transition:transform .32s cubic-bezier(.2,.8,.2,1);border:1px solid var(--glassln)}
.banner.show{transform:translateX(-50%) translateY(0)}
.banner .bt{font-weight:800;font-size:13px}
.banner .bb{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.banner .bi{font-size:22px;flex:0 0 auto}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(7,19,31,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.show{display:flex}
.sheet{width:100%;max-width:540px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--glassln);border-bottom:0;border-radius:24px 24px 0 0;padding:18px;box-shadow:var(--shadow);animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
.handle{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}

/* ===== misc ===== */
.row .nm{cursor:pointer}
.row[onclick]{cursor:pointer}
.av{position:relative}
.unread{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.unread.inline{position:static;display:inline-grid;border:0;box-shadow:none;vertical-align:middle;margin-inline-start:6px;height:18px}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
.av.big{width:88px;height:88px;font-size:34px;border-radius:28px}
.avwrap{position:relative;width:88px;margin:0 auto}
.avedit{position:absolute;bottom:-2px;left:-2px;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#04312e;font-size:14px;border:2px solid var(--surface);display:grid;place-items:center}
.qrbox{display:flex;flex-direction:column;align-items:center;margin:6px 0}
.qr{width:172px;height:172px;border-radius:14px;background:#fff;padding:9px;border:1px solid var(--line)}
.details{margin-top:10px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-child{border-bottom:0}
.dk{color:var(--muted);font-size:12.5px}
.dv{font-weight:700;font-size:13.5px}
.rowtime{font-size:10px;color:var(--muted);flex:0 0 auto;align-self:flex-start;margin-top:2px}
.loadmore{display:block;margin:4px auto 10px;padding:7px 17px;border:1px solid var(--line);background:var(--glass2);color:var(--muted);border-radius:999px;font-size:12px;font-family:inherit;cursor:pointer}
.addbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glassln);border-radius:var(--r);box-shadow:var(--soft);padding:7px;margin-bottom:14px}
.addbar input{border:0;outline:0;background:transparent;font-size:14px;padding:11px;min-width:0}
.addbar .cb{width:46px;height:46px}
.qstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.qs{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px;border:1px solid var(--glassln);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--soft);color:var(--text)}
.qs .icn{stroke:var(--teal);width:22px;height:22px}
.qs b{font-size:22px;color:var(--tealdeep);line-height:1;font-weight:900}
.qs span{font-size:11px;color:var(--muted)}
.qs.alert{border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.1)}
.qs.alert b,.qs.alert .icn{color:var(--amber);stroke:var(--amber)}

  var pub="";
  if(flag("public_groups_enabled")){
    var rows=M.pubGroups.length?M.pubGroups.map(function(g){var nmeName=esc(g.name).replace(/'/g,"");var act=g.joined?("openGroup('"+g.conversation_id+"','"+nmeName+"')"):("joinAndOpen('"+g.id+"','"+nmeName+"')");return '<div class="row" onclick="'+act+'"><div class="av g">'+esc(ini(g.name))+'</div><div class="grow"><div class="nm" onclick="event.stopPropagation();groupDetails(\''+g.conversation_id+'\')">'+esc(g.name)+'</div><div class="mut">'+esc(g.description||"")+' · '+g.members+' عضو</div></div>'+(g.joined?'<span class="chip secondary">فتح</span>':'<span class="chip on">انضمام</span>')+'</div>'}).join(""):'<div class="empty">لا مجموعات عامة بعد. أنشئ واحدة!</div>';
    pub='<div class="shead"><h3>مجموعات عامة</h3><span class="badge">'+M.pubGroups.length+'</span></div><div class="card">'+rows+'</div>';
  }
  return backBtn()+'<div class="addbar"><input id="gcode" placeholder="انضم بكود مجموعة: G-XXXXX" onkeydown="if(event.key===\'Enter\')joinByCode()"/><button class="cb" onclick="joinByCode()" title="انضمام">↳</button></div><div class="shead" style="margin-top:0"><h3>مجموعاتي</h3><span class="badge">'+M.groups.length+'</span></div><div class="card">'+mine+'</div>'+room+create+pub;
}
function scrChat(){
  var det = M.isGroup ? ("groupDetails('"+M.conv+"')") : (M.friendId?("friendDetails('"+M.friendId+"')"):"");
  var who = M.isGroup ? null : M.friends.find(function(f){return f.id===M.friendId});
  var headAv = M.isGroup ? ('<div class="av g" style="width:36px;height:36px;font-size:15px">'+esc(ini(M.friend.display_name))+'</div>') : ('<div class="av" style="width:36px;height:36px;font-size:15px">'+avatarInner(who||M.friend)+'</div>');
  var encBadge = (!M.isGroup && M.peerKey) ? '<span class="encb" onclick="event.stopPropagation();showTrust()" title="مشفّر طرف-إلى-طرف">🔒</span>' : "";
  var sumBtn = '<button class="chip" onclick="summarize()" title="ملخّص">📝</button>';
  return '<div class="chatwrap">'
    +'<div class="chathead"><button class="chip" onclick="go(\'friends\')">→</button>'
      +'<button class="idbtn"'+(det?(' onclick="'+det+'"'):'')+'>'+headAv+'<div style="text-align:start;min-width:0"><div class="nm" style="font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(M.friend.display_name)+' '+encBadge+'</div><div class="mut" id="typing" style="font-size:10px;display:none">يكتب الآن…</div><div class="mut" style="font-size:10px">اضغط لعرض التفاصيل ⓘ</div></div></button>'+sumBtn+'</div>'
    +'<div class="thread" id="thread"></div>'
    +'<div class="emoji" id="emoji">'+EMO.map(function(e){return '<button onclick="addEmoji(\''+e+'\')">'+e+'</button>'}).join("")+'</div>'
    +'<div class="replybar" id="replybar" style="display:none"><span class="rp"></span><button onclick="clearReply()">✕</button></div>'
    +'<div class="composer">'
      +'<button class="cb mini" onclick="toggleEmoji()" title="إيموجي">😊</button>'
      +'<button class="cb mini" onclick="pickImage()" title="صورة">'+ic("image","sm")+'</button>'
      +'<button class="cb mini rec" onclick="toggleVoice()" title="رسالة صوتية">🎤</button>'
      +'<button class="cb mini" id="ttlBtn" onclick="cycleTtl()" title="مؤقّت/حرق">'+ttlLabel()+'</button>'
      +'<button class="cb mini" onclick="suggestReply()" title="اقتراح رد">💡</button>'
      +'<input id="mi" placeholder="اكتب رسالة..." oninput="sendTyping()" onkeydown="if(event.key===\'Enter\')sendMsg()"/>'
      +'<button class="cb ghost" onclick="pingInChat()" title="تنبيه">📳</button>'
      +'<button class="cb" onclick="sendMsg()">'+ic("send","sm")+'</button>'
    +'</div>'
    +'<input type="file" id="imgInput" accept="image/*" style="display:none" onchange="onImagePicked(event)"/>'
    +'</div>';
}
function readTicks(m){ if(M.isGroup) return " ✓"; if(M.peerReadAt && Date.parse(m.created_at)<=Date.parse(M.peerReadAt)) return ' <span class="rr">✓✓</span>'; return " ✓"; }
function thread(noscroll){
  var el=$("thread"); if(!el)return;
  var head = M.moreMsgs ? '<button class="loadmore" onclick="loadOlder()">تحميل رسائل أقدم ↑</button>' : '';
  el.innerHTML=head+M.msgs.map(function(m){
    var mine=m.sender_id===M.me.id;
    if(m.kind==="ping"){return '<div class="pingmsg">📳 '+(mine?"أرسلتَ تنبيهًا":"نبّهك")+' · '+tm(m.created_at)+'</div>'}
    var sn=(M.isGroup&&!mine)?'<span class="sn">'+esc(M.members[m.sender_id]||"عضو")+'</span>':'';
    var rep=""; if(m.reply_to){ var rm=M.msgs.find(function(x){return x.id===m.reply_to}); if(rm){ var rt=rm.enc?(rm._txt||"🔒"):(rm.kind==="image"?"📷 صورة":(rm.kind==="voice"?"🎤 صوت":(rm.body||""))); rep='<span class="quote">'+esc((rt||"").slice(0,70))+'</span>'; } }
    var lock=m.enc?'<span class="lock">🔒</span>':'';
    var act='<button class="reply" onclick="setReply(\''+m.id+'\')" title="رد">↩</button>';
    var exp=m.expires_at?'<span class="exp">⏳ '+fmtLeft(m.expires_at)+'</span>':'';
    if(m.kind==="image"){ return '<div class="bub imgmsg '+(mine?"me":"")+'">'+sn+rep+'<img src="'+esc(m.body)+'" onclick="window.open(this.src,\'_blank\')"/><span class="t">'+exp+tm(m.created_at)+(mine?readTicks(m):"")+'</span>'+act+'</div>'; }
    if(m.kind==="voice"){ var inner = mine ? '🎤 رسالة صوتية · تُسمع مرة واحدة' : '<button class="voicebtn" onclick="playVoice(\''+m.id+'\',this)">🎤 استمع (مرة واحدة)</button>'; return '<div class="bub '+(mine?"me":"")+'">'+sn+inner+'<span class="t">'+tm(m.created_at)+(mine?readTicks(m):"")+'</span></div>'; }
    var txt = m.enc ? (m._txt||"🔒 رسالة مشفّرة") : m.body;
    if(m.burn && !mine){ return '<div class="bub burn">'+sn+'<button class="voicebtn" onclick="revealBurn(\''+m.id+'\',this)">🔥 اضغط للكشف (تُحذف بعد القراءة)</button></div>'; }
    var burnTag = m.burn?'<span class="exp">🔥</span>':'';
    return '<div class="bub '+(mine?"me":"")+'">'+sn+rep+lock+esc(txt)+'<span class="t">'+burnTag+exp+tm(m.created_at)+(mine?readTicks(m):"")+'</span>'+act+'</div>'
  }).join("")||'<div class="empty">لا رسائل بعد. ابدأ المحادثة 🌿</div>';
  if(!noscroll) el.scrollTop=el.scrollHeight;
}
window.loadOlder=async function(){
  if(!M.msgs.length)return; var el=$("thread"); var prevH=el?el.scrollHeight:0;
  var oldest=M.msgs[0].created_at;
  var r=await SB.from("messages").select("*").eq("conversation_id",M.conv).lt("created_at",oldest).order("created_at",{ascending:false}).limit(40);
  var older=(r.data||[]).slice().reverse(); M.moreMsgs=((r.data||[]).length===40);
  if(!older.length){ M.moreMsgs=false; thread(true); return; }
  M.msgs=older.concat(M.msgs); thread(true);
  if(el){ el.scrollTop = el.scrollHeight - prevH; }
};
function scrQid(){
  var list=M.qids.filter(function(q){return !q.revoked}).map(function(q){return '<div class="row"><div class="av">🪪</div><div class="grow"><div class="nm" style="direction:ltr;cursor:pointer" onclick="copyText(\''+esc(q.code)+'\')">'+esc(q.code)+'</div><div class="mut">اضغط للنسخ · صالح 30 يومًا</div></div><button class="chip" onclick="killQid(\''+q.id+'\')">إلغاء</button></div>'}).join("")||'<div class="empty">لا هويات نشطة. أنشئ واحدة وشاركها.</div>';
  return backBtn()+'<div class="strip">🪪 أنشئ كودًا تشاركه مع من تريد إضافته. يكتبه في خانة «إضافة صديق» في صفحته الرئيسية فيصلك طلب صداقة. بديل أنيق عن مشاركة رقمك الدائم.</div><button class="btn primary full" onclick="makeQid()" style="margin-bottom:12px">إنشاء Q-ID جديد</button><div class="card">'+list+'</div>';
}
function scrProfile(){
  var p=M.profile;
  var qrData=p.username?("@"+p.username):(p.pin||p.display_name);
  return backBtn()
    +'<div class="card" style="text-align:center">'
      +'<div class="avwrap"><div class="av big" style="margin:0 auto">'+avatarInner(p)+'</div><button class="avedit" onclick="pickAvatar()" title="تغيير الصورة">📷</button></div>'
      +'<div class="nm" style="font-size:20px;margin-top:10px">'+esc(p.display_name)+'</div>'
      +'<div class="mut" style="direction:ltr;cursor:pointer;color:var(--tealdeep);font-weight:700" onclick="copyText(\'@'+esc(p.username||"")+'\')">@'+esc(p.username||"")+' ⧉</div>'
      +(p.status?'<div class="mut" style="margin-top:4px">'+esc(p.status)+'</div>':'')
      +'<input type="file" id="avInput" accept="image/*" style="display:none" onchange="onAvatarPicked(event)"/>'
    +'</div>'
    +'<div class="card" style="text-align:center"><div class="shead" style="margin-top:0;justify-content:center"><h3>بطاقتي · شاركها ليضيفك الآخرون</h3></div>'
      +'<div class="qrbox">'+qrImg(qrData,190)+'</div>'
      +'<div class="details" style="margin-top:6px">'
        +'<div class="drow" onclick="copyText(\'@'+esc(p.username||"")+'\')"><span class="dk">المعرّف</span><span class="dv" style="direction:ltr;color:var(--tealdeep)">@'+esc(p.username||"")+' ⧉</span></div>'
        +'<div class="drow" onclick="copyPin()"><span class="dk">الكود (PIN)</span><span class="dv" style="direction:ltr">'+esc(p.pin)+' ⧉</span></div>'
      +'</div>'
    +'</div>'
    +'<div class="card"><div class="field2"><label>اسم العرض</label><input id="pn" value="'+esc(p.display_name)+'"/></div><div class="field2"><label>الحالة</label><input id="ps" value="'+esc(p.status||"")+'"/></div><button class="btn primary full" onclick="saveProfile()">حفظ</button></div>';
}
function scrSettings(){
  var dark=localStorage.getItem("pqn_dark")==="1"; var a=localStorage.getItem("pqn_accent")||"teal";
  var sw=Object.keys(ACCENTS).map(function(k){return '<button class="swatch'+(a===k?" on":"")+'" style="background:'+ACCENTS[k][0]+'" onclick="setAccent(\''+k+'\')"></button>'}).join("");
  return backBtn()+'<div class="card" style="text-align:center"><div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:10px"><span class="qmark" style="width:38px;height:38px"><i></i><i></i></span><div style="font-weight:900;font-size:18px">ثبّت PQN</div></div><div class="mut" style="margin-bottom:12px;line-height:1.7">أضِف التطبيق إلى شاشتك الرئيسية ليفتح كتطبيق مستقلّ بأيقونته الخاصة.</div><button class="btn primary full" onclick="installApp()">📲 تثبيت على الشاشة الرئيسية</button></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>المظهر</h3></div><div class="mut" style="margin-bottom:8px">الوضع</div><div class="acts" style="margin-bottom:16px"><button class="chip '+(!dark?"on":"")+'" onclick="setDark(false)">فاتح ☀️</button><button class="chip '+(dark?"on":"")+'" onclick="setDark(true)">داكن 🌙</button></div><div class="mut" style="margin-bottom:10px">اللون</div><div class="swatches">'+sw+'</div></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>الإشعارات</h3></div><div class="mut" style="margin-bottom:12px;line-height:1.7">فعّل الإشعارات لتصلك التنبيهات حتى عند إغلاق التطبيق.<br/>على آيفون: أضِف التطبيق للشاشة الرئيسية أولًا.</div><button class="btn secondary full" onclick="enableNotifs()">تفعيل الإشعارات على هذا الجهاز</button></div>'
    +(function(){ var q=quietCfg(); return '<div class="card"><div class="shead" style="margin-top:0"><h3>🌙 الوضع الهادئ</h3><div class="sw '+(q.on?"on":"")+'" onclick="setQuiet('+(q.on?"false":"true")+')"></div></div><div class="mut" style="margin-bottom:10px;line-height:1.7">يكتم الأصوات والاهتزاز وإشعارات النظام خلال الفترة التي تحددها — تبقى الرسائل تصلك بهدوء دون إزعاج.</div><div class="acts"><div class="field2" style="flex:1"><label>من</label><input type="time" value="'+esc(q.from)+'" onchange="setQuietTime(\'from\',this.value)"/></div><div class="field2" style="flex:1"><label>إلى</label><input type="time" value="'+esc(q.to)+'" onchange="setQuietTime(\'to\',this.value)"/></div></div></div>'; })()
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>🔑 مفتاح التشفير</h3></div><div class="mut" style="margin-bottom:10px;line-height:1.7">محادثاتك المباشرة مشفّرة طرف-إلى-طرف. مفتاحك محفوظ على هذا الجهاز فقط. احفظ نسخة منه لتستعيد قراءة رسائلك على جهاز آخر أو بعد مسح المتصفّح.</div><div class="acts"><button class="chip" onclick="exportKey()">📤 حفظ نسخة المفتاح</button><button class="chip" onclick="importKeyPrompt()">📥 استعادة مفتاح</button></div></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>أرسل اقتراحًا 💡</h3></div><div class="field2"><textarea id="sg" placeholder="اكتب اقتراحك لتحسين التطبيق..."></textarea></div><button class="btn primary full" onclick="sendSuggestion()">إرسال الاقتراح</button></div>'
    +(M.owner?ownerPanel():ownerLogin());
}
function ownerLogin(){
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>دخول المالك 🔑</h3></div><div class="mut" style="margin-bottom:10px">خاص بمالك التطبيق للتحكّم والاطّلاع على المقترحات.</div><div class="field2"><input id="oe" type="email" placeholder="البريد"/></div><div class="field2"><input id="op" type="password" placeholder="كلمة المرور"/></div><button class="btn secondary full" onclick="ownerLoginGo()">دخول</button></div>';
}
function tgRow(k,label){ return '<div class="tg"><div><div class="nm" style="font-size:13.5px">'+label+'</div></div><div class="sw '+(flag(k)?"on":"")+'" onclick="toggleFlag(\''+k+'\')"></div></div>'; }
function ownerPanel(){
  var s=M.stats||{};
  var stats='<div class="stats"><div class="stat"><b>'+(s.users||0)+'</b><span>المستخدمون</span></div><div class="stat"><b>'+(s.new_today||0)+'</b><span>جدد اليوم</span></div><div class="stat"><b>'+(s.groups||0)+'</b><span>المجموعات</span></div><div class="stat"><b>'+(s.messages||0)+'</b><span>الرسائل</span></div><div class="stat"><b>'+(s.friends||0)+'</b><span>الصداقات</span></div><div class="stat"><b>'+(s.suggestions||0)+'</b><span>المقترحات</span></div></div>';
  var toggles=tgRow("signups_enabled","فتح التسجيل (دخول أعضاء جدد)")+tgRow("messaging_enabled","تفعيل المراسلة")+tgRow("groups_enabled","تفعيل المجموعات")+tgRow("public_groups_enabled","تفعيل المجموعات العامة");
  var users=(M.recent||[]).map(function(u){return '<div class="row"><div class="av">'+esc(ini(u.display_name))+'</div><div class="grow"><div class="nm">'+esc(u.display_name)+'</div><div class="mut">'+dt(u.created_at)+'</div></div></div>'}).join("")||'<div class="empty">لا مستخدمين</div>';
  var sug=(M.suggestions||[]).map(function(x){return '<div class="row"><div class="grow"><div class="nm">'+esc(x.author_name||"مجهول")+'</div><div class="mut" style="white-space:pre-wrap">'+esc(x.body)+'</div><div class="mut" style="font-size:10px;margin-top:4px">'+tm(x.created_at)+'</div></div><button class="chip" onclick="delSuggestion(\''+x.id+'\')">حذف</button></div>'}).join("")||'<div class="empty">لا مقترحات بعد</div>';
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>📊 لوحة المالك</h3><span class="badge">تحكّم</span></div>'+stats+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>⚙️ خيارات التفعيل والإغلاق</h3></div>'+toggles+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>👤 أحدث الأعضاء</h3><span class="badge">'+((M.recent||[]).length)+'</span></div>'+users+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>📋 المقترحات</h3><span class="badge">'+((M.suggestions||[]).length)+'</span></div>'+sug+'</div>';
}
</script>
