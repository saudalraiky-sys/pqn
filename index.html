<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PQN — دائرتك الخاصة</title>
<meta name="theme-color" content="#0E7A5F"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
:root{
  --em:#0E7A5F;--em2:#16A37C;--emdeep:#0A5240;
  --gold:#C9A227;--gold2:#E6CB72;--golddeep:#9C7B14;
  --teal:#0E7A5F;--teal2:#16A37C;--tealdeep:#0A5240;
  --amber:#D99A2B;--rose:#E5645D;
  --navy:#0C1F19;
  --bg:#EFF3F1;--surface:#FFFFFF;--surface2:#E9EFEC;--text:#0A1712;--muted:#5C6E65;
  --line:#E3EAE6;
  --soft:0 1px 2px rgba(8,20,15,.05),0 6px 22px rgba(8,20,15,.06);
  --shadow:0 22px 60px rgba(8,20,15,.22);
  --r:20px;--r2:14px;--font:"Tajawal","SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  color-scheme:light}
body.dark{
  --bg:#060F0B;--surface:#0D1813;--surface2:#13211B;--text:#E9F2EE;--muted:#90A69B;
  --line:#1C2A23;--navy:#081310;
  --soft:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.3);
  --shadow:0 22px 60px rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--text);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{display:block}
.icn{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.icn.sm{width:18px;height:18px}.icn.lg{width:28px;height:28px}

/* brand mark */
.qmark{position:relative;width:42px;height:42px;border:3px solid var(--gold);border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 16%,transparent)}
.qmark::after{content:"";position:absolute;bottom:5%;left:-12%;width:38%;height:13%;border-radius:99px;background:var(--gold);transform:rotate(42deg)}
.qmark i{position:absolute;top:34%;width:13%;height:13%;border-radius:50%;background:var(--em2)}.qmark i:first-child{right:30%}.qmark i:last-child{right:52%}

/* ===== auth ===== */
.center{min-height:100vh;display:grid;place-items:center;padding:26px;background:
  radial-gradient(1100px 520px at 84% -12%,color-mix(in srgb,var(--em) 16%,transparent),transparent 60%),
  radial-gradient(820px 440px at -10% 110%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 55%),var(--bg)}
.auth{width:100%;max-width:392px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:40px 28px}
.brand{display:inline-flex;align-items:center;gap:13px;font-weight:900;font-size:32px;letter-spacing:-.5px;margin-bottom:10px;background:linear-gradient(120deg,var(--emdeep),var(--em) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.dark .brand{background:linear-gradient(120deg,var(--em2),var(--gold2));-webkit-background-clip:text;background-clip:text}
.tag{color:var(--muted);font-size:15px;margin:0 0 30px;line-height:1.7}
.field{margin-bottom:16px;text-align:right}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.field input{width:100%;min-height:56px;padding:15px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface2);outline:none;font-size:16.5px;text-align:center;transition:.18s}
.field input:focus{border-color:var(--em);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--em) 14%,transparent)}
.priv{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.85}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:15px 18px;border-radius:16px;font-weight:800;font-size:15.5px;border:1px solid transparent;transition:transform .1s ease,opacity .2s,filter .2s}
.btn.full{width:100%}
.primary{background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;box-shadow:0 10px 26px -6px color-mix(in srgb,var(--em) 60%,transparent)}
.primary:active{transform:scale(.985);filter:brightness(.97)}
.secondary{background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--emdeep)}
body.dark .secondary{color:var(--em2)}
.btn.soft{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.soft:active,.secondary:active{transform:scale(.985)}
.btn.danger{background:color-mix(in srgb,var(--rose) 13%,transparent);color:var(--rose)}
.hidden{display:none!important}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:var(--navy);color:#EAF5F0;padding:14px 20px;border-radius:15px;font-size:14px;opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);z-index:999;max-width:88%;box-shadow:var(--shadow);text-align:center;pointer-events:none;border:1px solid color-mix(in srgb,var(--gold) 22%,transparent)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== shell ===== */
.shell{display:none;max-width:600px;margin:0 auto;min-height:100vh;position:relative;background:var(--surface)}
body.in .shell{display:flex;flex-direction:column;height:100dvh}body.in .center{display:none}
body.in{background:var(--surface)}
@media(min-width:601px){body.in{background:var(--bg)}.shell{box-shadow:0 0 80px rgba(8,20,15,.10)}}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 20px 14px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.4px}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grow{flex:1;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--golddeep);font-weight:800;background:color-mix(in srgb,var(--gold) 14%,transparent);padding:6px 12px;border-radius:99px}
body.dark .live{color:var(--gold2)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:20px}

/* ===== cards / sections ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card.pad{padding:18px}
.greet{font-size:25px;font-weight:900;letter-spacing:-.6px;margin:6px 2px 20px}.greet span{background:linear-gradient(120deg,var(--em),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero{background:linear-gradient(150deg,var(--navy),color-mix(in srgb,var(--em) 40%,var(--navy)));color:#fff;border:0;text-align:center;padding:24px;border-radius:var(--r);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:-40%;left:-20%;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 40%,transparent),transparent 70%)}
.hero .lbl{font-size:12px;color:#A9C2B8;margin-bottom:10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 13px}
.shead:first-child{margin-top:4px}
.shead h3{margin:0;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.shead h3 .icn{stroke:var(--muted);width:17px;height:17px}
.badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--golddeep);font-size:11.5px;font-weight:800}
body.dark .badge{color:var(--gold2)}

/* rows */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;background:var(--em);flex:0 0 auto;position:relative;overflow:visible}
.av.g{background:var(--gold);color:#3A2C00}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.nm{font-weight:800;font-size:15.5px;letter-spacing:-.2px}.mut{color:var(--muted);font-size:13px;margin-top:3px}
.pin{direction:ltr;display:inline-block;padding:12px 20px;border-radius:13px;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);font-weight:800;letter-spacing:2px;font-size:20px;cursor:pointer}
.strip{padding:12px 14px;border-radius:13px;background:color-mix(in srgb,var(--em) 9%,transparent);color:var(--emdeep);font-size:12.5px;line-height:1.6;margin-bottom:14px}
body.dark .strip{color:var(--em2)}
.warn{background:color-mix(in srgb,var(--amber) 15%,transparent);color:#8A5B00}
body.dark .warn{color:var(--amber)}
.field2{margin-bottom:13px}.field2 label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field2 input,.field2 textarea,.field2 select{width:100%;min-height:50px;padding:13px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface2);outline:none;font-size:15px;transition:.16s}
.field2 textarea{resize:vertical;min-height:84px;line-height:1.6}
.field2 input:focus,.field2 textarea:focus,.field2 select:focus{border-color:var(--em);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--em) 12%,transparent)}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px;line-height:1.8}
.acts{display:flex;gap:7px;flex:0 0 auto;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;color:var(--text)}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;border-color:transparent}
.chip.secondary{background:color-mix(in srgb,var(--em) 10%,transparent);color:var(--emdeep);border-color:transparent}
body.dark .chip.secondary{color:var(--em2)}
.chip.ping{background:color-mix(in srgb,var(--gold) 15%,transparent);border-color:transparent}
.chip.ping .icn{stroke:var(--golddeep)}
body.dark .chip.ping .icn{stroke:var(--gold2)}
.swatches{display:flex;gap:13px;flex-wrap:wrap;padding:6px 0}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:transform .12s}
.swatch.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--em) 50%,transparent);transform:scale(1.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 0}
.stat{background:var(--surface2);border-radius:15px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:23px;color:var(--text);font-weight:900;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.tg{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.tg:last-child{border-bottom:0}
.tg .nm{font-weight:700;font-size:14.5px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.22s;flex:0 0 auto;cursor:pointer}
.sw.on{background:var(--em)}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.sw.on::after{right:23px}

/* quick stats */
.qstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:8px}
.qs{display:flex;flex-direction:column;align-items:center;gap:7px;padding:17px 6px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--text);transition:transform .1s}
.qs:active{transform:scale(.97)}
.qs .icn{stroke:var(--em);width:22px;height:22px}
.qs b{font-size:22px;color:var(--text);line-height:1;font-weight:900}
.qs span{font-size:11.5px;color:var(--muted)}
.qs.alert{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.qs.alert b,.qs.alert .icn{color:var(--golddeep);stroke:var(--gold)}

/* add bar */
.addbar{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:7px;margin-bottom:18px}
.addbar input{border:0;outline:0;background:transparent;font-size:15px;padding:12px;min-width:0}
.addbar .cb{width:46px;height:46px;border-radius:13px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface2);border-radius:15px;padding:5px;margin-bottom:16px}
.tabs .tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:11px;font-size:14px;font-weight:800;color:var(--muted);background:transparent;transition:.18s}
.tabs .tab .icn{width:18px;height:18px;stroke:var(--muted)}
.tabs .tab.on{background:var(--surface);color:var(--emdeep);box-shadow:var(--soft)}
.tabs .tab.on .icn{stroke:var(--em)}
body.dark .tabs .tab.on{color:var(--em2)}

/* ===== chat ===== */
.thread{display:flex;flex-direction:column;gap:3px;padding:4px 0}
.bubwrap{display:flex;flex-direction:column;max-width:80%;margin-bottom:7px}
.bubwrap.me{align-self:flex-end;align-items:flex-end}
.bub{padding:10px 14px;border-radius:21px 21px 21px 7px;background:var(--surface2);font-size:14.5px;line-height:1.55;position:relative;word-break:break-word;animation:bubIn .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes bubIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.me{background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;border-radius:21px 21px 7px 21px}
.bub.me .mut,.bub.me .t{color:rgba(255,255,255,.82)}
.bub .sn{display:block;font-size:11px;font-weight:800;color:var(--emdeep);margin-bottom:3px}
body.dark .bub .sn{color:var(--em2)}
.bub .t{display:block;font-size:11px;color:var(--muted);margin-top:5px;text-align:end}
.bub .quote{display:block;border-inline-start:3px solid currentColor;opacity:.85;padding:5px 9px;border-radius:8px;font-size:12px;margin-bottom:6px;background:rgba(0,0,0,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub.me .quote{background:rgba(255,255,255,.16)}
.bub .lock{display:inline-flex;vertical-align:middle;margin-inline-end:4px;opacity:.7}
.bub .lock .icn{width:12px;height:12px}
.bub .rr{font-weight:800}
.bub .exp{color:var(--gold);font-size:9.5px;margin-inline-end:5px}
.bub.me .exp{color:var(--gold2)}
.bub.burn{background:color-mix(in srgb,var(--rose) 12%,transparent)}
.burntxt{color:var(--rose);font-weight:600}
.bub .edt{font-size:9.5px;opacity:.7;margin-inline-end:5px;font-style:italic}
.bub.del{color:var(--muted);font-style:italic;display:inline-flex;align-items:center;gap:5px;background:var(--surface2)}
.bub.del .icn{width:14px;height:14px;stroke:var(--muted)}
.bub .msgmenu{position:absolute;top:2px;left:6px;opacity:0;background:transparent;border:0;color:currentColor;font-size:16px;cursor:pointer;line-height:1;padding:2px 4px;transition:opacity .15s}
.bub:hover .msgmenu,.bubwrap:active .msgmenu{opacity:.55}
.mreacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;padding:0 4px}
.mreact{display:inline-flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--soft)}
.mreact.on{background:color-mix(in srgb,var(--em) 16%,transparent);border-color:var(--em);color:var(--emdeep)}
body.dark .mreact.on{color:var(--em2)}
.reactpick{display:flex;justify-content:space-around;gap:6px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.reactpick button{font-size:28px;background:none;border:0;cursor:pointer;transition:transform .12s;line-height:1}
.reactpick button:active{transform:scale(1.4)}
.imgmsg{padding:5px}.imgmsg img{max-width:230px;max-height:280px;border-radius:16px;display:block;cursor:pointer}
.voicebtn{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--gold) 15%,transparent);border:0;border-radius:13px;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--golddeep)}
body.dark .voicebtn{color:var(--gold2)}
.bub.me .voicebtn{background:rgba(255,255,255,.2);color:#fff}
.pingmsg{align-self:center;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--golddeep);padding:7px 16px;border-radius:99px;font-size:12.5px;font-weight:700;margin:6px 0}
body.dark .pingmsg{color:var(--gold2)}
.loadmore{display:block;margin:6px auto 12px;padding:8px 18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;font-size:12.5px;cursor:pointer}

/* sheets */
.msheet{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.msheet-item{display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:13px;background:transparent;color:var(--text);font-size:15px;font-weight:600;text-align:start;width:100%}
.msheet-item:active{background:var(--surface2)}
.msheet-item.danger{color:var(--rose)}
.msheet-item .icn{stroke:currentColor;width:20px;height:20px}
.msheet-note{padding:9px 14px;color:var(--muted);font-size:11.5px;line-height:1.6}

/* composer (iMessage-like) */
.replybar{display:flex;align-items:center;gap:9px;margin:0 0 8px;padding:10px 14px;border-inline-start:3px solid var(--em);border-radius:13px;background:var(--surface2)}
.replybar .rp{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
.encb{display:inline-flex;cursor:pointer;vertical-align:middle}
.encb .icn{width:13px;height:13px;stroke:var(--gold)}
.composer{display:flex;align-items:flex-end;gap:9px;padding:8px 4px;background:transparent}
.composer .cwrap{flex:1 1 auto;display:flex;align-items:center;gap:4px;min-width:0;background:var(--surface2);border:.5px solid var(--line);border-radius:23px;padding:4px;padding-inline-start:15px}
.composer input{border:0;outline:0;background:transparent;font-size:15.5px;padding:9px 0;min-width:0;flex:1 1 auto}
.cplus,.csend,.cemoji{display:grid;place-items:center;flex:0 0 auto;transition:transform .12s,background .2s}
.cplus:active,.csend:active,.cemoji:active{transform:scale(.86)}
.cplus{width:38px;height:38px;border-radius:50%;background:transparent;color:var(--muted)}
.cplus .icn{stroke-width:1.8}
.cplus.act{color:var(--em);background:color-mix(in srgb,var(--em) 12%,transparent)}
.cemoji{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--muted)}
.csend{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--em) 60%,transparent)}
.csend .icn{stroke-width:2.2}
.cb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;font-size:18px;flex:0 0 auto;transition:transform .1s}
.cb:active{transform:scale(.9)}
.cb.mini{width:40px;height:40px;background:transparent;color:var(--muted);font-size:18px}
.cb.mini .icn{stroke:var(--muted)}
.cb.ghost{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--golddeep)}
body.dark .cb.ghost{color:var(--gold2)}
body.recording .cb.rec{background:var(--rose);color:#fff;animation:pulse 1.1s infinite}
.emoji{display:none;flex-wrap:wrap;gap:4px;max-height:160px;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:17px;background:var(--surface);margin-bottom:8px}
.emoji.show{display:flex}
.emoji button{font-size:23px;background:none;border:0;padding:5px;line-height:1;cursor:pointer}
.chatwrap{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex:0 0 auto}

async function ensureKeys(){

    var sk=localStorage.getItem("pqn_ecdh");
    if(sk){ var o=JSON.parse(sk); _myPriv=await _crypto.importKey("jwk",o.priv,{name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]); _myPubJwk=o.pub; }

      var pj=await _crypto.exportKey("jwk",kp.publicKey); var sj=await _crypto.exportKey("jwk",kp.privateKey);
      _myPubJwk=pj; localStorage.setItem("pqn_ecdh",JSON.stringify({priv:sj,pub:pj}));
    }

    if(M.me && M.profile && M.profile.pubkey!==pubStr){ try{ await SB.from("profiles").update({pubkey:pubStr}).eq("id",M.me.id); M.profile.pubkey=pubStr; }catch(e){} }
    return true;

}
async function peerKeyFor(peerId, peerPubStr){
  if(!_crypto||!_myPriv||!peerPubStr) return null;

    var key=await _crypto.deriveKey({name:"ECDH",public:pub},_myPriv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);

}

function startLive(){
  if(M.live) return;
  M.live=SB.channel("live-"+M.me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"recipient_id=eq."+M.me.id},function(){ var n=M.requests.length; refreshAll(true).then(function(){ if(M.requests.length>n){ buzz(); toast("📬 طلب صداقة جديد"); notify("PQN","📬 طلب صداقة جديد"); } }); })
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"requester_id=eq."+M.me.id},function(){ refreshAll(true); })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){ var m=p.new; if(m.sender_id===M.me.id) return; if(isBlocked(m.sender_id)) return; if(M.screen==="chat"&&m.conversation_id===M.conv) return; var fr=M.friends.find(function(x){return x.id===m.sender_id}); var who=(fr&&fr.display_name)||"رسالة"; M.unread[m.sender_id]=(M.unread[m.sender_id]||0)+1; if(fr){ fr.last_at=m.created_at||new Date().toISOString(); sortFriends(); } if(M.screen==="friends") render(); var q=quietActive()||convMuted(m.conversation_id); if(m.kind==="ping"){ if(!q)pingAlert(); inAppNote("📳 "+who, "نبّهك بتنبيه", m.conversation_id, who); if(!q)notify("📳 "+who,"نبّهك", m.sender_id); } else { if(!q){buzz([45]); playBlip();} var prev=m.kind==="image"?"📷 صورة":(m.kind==="voice"?"🎤 رسالة صوتية (مرة واحدة)":(m.enc?"🔒 رسالة مشفّرة":(m.body||"رسالة جديدة"))); var cnt=M.unread[m.sender_id]; inAppNote("📨 "+who+(cnt>1?" ("+cnt+")":""), prev, m.conversation_id, who); if(!q)notify(who+(cnt>1?" ("+cnt+" رسائل)":""), prev, m.sender_id); } })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"broadcasts"},function(p){ var b=p.new; if(!b||!b.active||b.host_id===M.me.id) return; var fr=M.friends.find(function(x){return x.id===b.host_id}); if(!fr) return; if(!quietActive()){ pingAlert(); } inAppNote("🔴 "+fr.display_name, "بدأ بثًّا في الدائرة", null, null); notify("🔴 "+fr.display_name, "بدأ بثًّا في الدائرة"); loadCircle().then(function(){ if(M.screen==="circle") render(); }); })
    .on("presence",{event:"sync"},function(){ try{ var st=M.live.presenceState(); var seen={}; for(var k in st){ (st[k]||[]).forEach(function(m){ if(m&&m.id) seen[m.id]=true; }); } M.online=seen; if(M.screen==="circle"||M.screen==="friends") render(); }catch(e){} })
    .subscribe(function(s){ if(s==="SUBSCRIBED"){ try{ M.live.track({id:M.me.id,name:(M.profile&&M.profile.display_name)||"مستخدم"}); }catch(e){} } });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && M.me) autoTick(); });
}

  refreshAll(true);

}

async function openConv(conv, name, isGroup){
  M.conv=conv; M.friend={display_name:name}; M.isGroup=isGroup; M.members={}; M.replyTo=null; M.peerReadAt=null; M.reacts={}; M.hidden={}; M.editing=null; M.inSearch=""; M.searchOpen=false; M.muteState=null; if(isGroup) M.friendId=null;
  if(isGroup){ try{ var mm=await SB.from("conversation_members").select("user_id").eq("conversation_id",conv); var ids=(mm.data||[]).map(function(x){return x.user_id}); if(ids.length){ var pr=await SB.from("profiles").select("id,display_name").in("id",ids); (pr.data||[]).forEach(function(p){M.members[p.id]=p.display_name}); } }catch(e){} }
  var ms=await SB.from("messages").select("*").eq("conversation_id",conv).order("created_at",{ascending:false}).limit(40); M.msgs=(ms.data||[]).slice().reverse(); M.moreMsgs=((ms.data||[]).length===40);
  if(!isGroup){ await setupPeerKey(); await decryptAll(); try{ var pr2=await SB.rpc("peer_read_at",{p_conv:conv}); M.peerReadAt=pr2.data||null; }catch(e){} }
  await loadReacts(); await loadMuteState(); await loadHidden();
  await leaveChat();
  SB.rpc("mark_read",{p_conv:conv});
  M.chan=SB.channel("conv-"+conv,{config:{broadcast:{self:false}}})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+conv},async function(p){ var nm=p.new; if(nm.enc&&!M.isGroup){ try{ nm._txt=await decMsg(nm); }catch(e){} } M.msgs.push(nm); if(nm.sender_id===M.me.id){ if(!M.isGroup && M.friendId){ var ff=M.friends.find(function(x){return x.id===M.friendId}); if(ff){ ff.last_at=nm.created_at||new Date().toISOString(); sortFriends(); } } } else { var q=quietActive()||muteActiveLocal(); if(nm.kind==="ping"){ if(!q)pingAlert(); } else { if(!q){playBlip(); buzz([30]);} } SB.rpc("mark_read",{p_conv:conv}); try{ M.chan.send({type:"broadcast",event:"read",payload:{}}); }catch(e){} } if(M.screen==="chat") thread(); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"conversation_id=eq."+conv},async function(p){ var u=p.new; var idx=M.msgs.findIndex(function(x){return x.id===u.id}); if(idx<0)return; if(u.enc&&!M.isGroup){ try{ u._txt=await decMsg(u); }catch(e){} } M.msgs[idx]=u; if(M.screen==="chat") thread(true); })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},function(p){ var id=p.old&&p.old.id; if(!id)return; var n=M.msgs.length; M.msgs=M.msgs.filter(function(x){return x.id!==id}); if(M.msgs.length!==n && M.screen==="chat") thread(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"message_reactions",filter:"conversation_id=eq."+conv},function(){ loadReacts().then(function(){ if(M.screen==="chat") thread(true); }); })
    .on("broadcast",{event:"typing"},function(p){ if(M.isGroup)return; M.peerTyping=true; var el=$("typing"); if(el)el.style.display="block"; clearTimeout(M._tw); M._tw=setTimeout(function(){ M.peerTyping=false; var e2=$("typing"); if(e2)e2.style.display="none"; },3500); })
    .on("broadcast",{event:"read"},function(p){ M.peerReadAt=new Date().toISOString(); if(M.screen==="chat") thread(true); })
    .subscribe();
  M.screen="chat"; render();
}

  if(m.kind==="text"){ rows+='<button class="msheet-item" onclick="copyMsg(\''+id+'\')">'+ic("copy","sm")+' نسخ النص</button>'; }

function friendSections(list){
  var now=Date.now(), DAY=86400e3;
  var startToday=new Date(); startToday.setHours(0,0,0,0); startToday=startToday.getTime();
  var buckets={unread:[],now:[],today:[],week:[],older:[]};
  list.forEach(function(f){
    var u=M.unread[f.id]||0; var on=!!M.online[f.id]; var t=f.last_at?Date.parse(f.last_at):0;
    if(u>0) buckets.unread.push(f);
    else if(on) buckets.now.push(f);
    else if(t>=startToday) buckets.today.push(f);
    else if(t>=now-7*DAY && t>0) buckets.week.push(f);
    else buckets.older.push(f);
  });
  var order=[["unread","غير مقروء","🔵"],["now","متّصل الآن","🟢"],["today","اليوم",""],["week","هذا الأسبوع",""],["older","أقدم",""]];
  var html="";
  order.forEach(function(s){ var arr=buckets[s[0]]; if(!arr.length)return;
    arr.sort(function(a,b){ return (b.last_at?Date.parse(b.last_at):0)-(a.last_at?Date.parse(a.last_at):0); });
    html+='<div class="shead"><h3>'+(s[2]?s[2]+' ':'')+s[1]+'</h3><span class="badge">'+arr.length+'</span></div><div class="card">'+arr.map(friendRow).join("")+'</div>';
  });
  return html;
}

window.loadOlder=async function(){

  var older=(r.data||[]).slice().reverse(); M.moreMsgs=((r.data||[]).length===40);
  if(!older.length){ M.moreMsgs=false; thread(true); return; }
  M.msgs=older.concat(M.msgs); thread(true);
  if(el){ el.scrollTop = el.scrollHeight - prevH; }
};

    +(function(){ var q=quietCfg(); return '<div class="card"><div class="shead" style="margin-top:0"><h3>🌙 الوضع الهادئ</h3><div class="sw '+(q.on?"on":"")+'" onclick="setQuiet('+(q.on?"false":"true")+')"></div></div><div class="mut" style="margin-bottom:10px;line-height:1.7">يكتم الأصوات والاهتزاز وإشعارات النظام خلال الفترة التي تحددها — تبقى الرسائل تصلك بهدوء دون إزعاج.</div><div class="acts"><div class="field2" style="flex:1"><label>من</label><input type="time" value="'+esc(q.from)+'" onchange="setQuietTime(\'from\',this.value)"/></div><div class="field2" style="flex:1"><label>إلى</label><input type="time" value="'+esc(q.to)+'" onchange="setQuietTime(\'to\',this.value)"/></div></div></div>'; })()
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>🔑 مفتاح التشفير</h3></div><div class="mut" style="margin-bottom:10px;line-height:1.7">محادثاتك المباشرة مشفّرة طرف-إلى-طرف. مفتاحك محفوظ على هذا الجهاز فقط. احفظ نسخة منه لتستعيد قراءة رسائلك على جهاز آخر أو بعد مسح المتصفّح.</div><div class="acts"><button class="chip" onclick="exportKey()">📤 حفظ نسخة المفتاح</button><button class="chip" onclick="importKeyPrompt()">📥 استعادة مفتاح</button></div></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>أرسل اقتراحًا 💡</h3></div><div class="field2"><textarea id="sg" placeholder="اكتب اقتراحك لتحسين التطبيق..."></textarea></div><button class="btn primary full" onclick="sendSuggestion()">إرسال الاقتراح</button></div>'
    +(M.owner?ownerPanel():ownerLogin());
}
function ownerLogin(){
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>دخول المالك 🔑</h3></div><div class="mut" style="margin-bottom:10px">خاص بمالك التطبيق للتحكّم والاطّلاع على المقترحات.</div><div class="field2"><input id="oe" type="email" placeholder="البريد"/></div><div class="field2"><input id="op" type="password" placeholder="كلمة المرور"/></div><button class="btn secondary full" onclick="ownerLoginGo()">دخول</button></div>';
}
function tgRow(k,label){ return '<div class="tg"><div><div class="nm" style="font-size:13.5px">'+label+'</div></div><div class="sw '+(flag(k)?"on":"")+'" onclick="toggleFlag(\''+k+'\')"></div></div>'; }
function ownerPanel(){
  var s=M.stats||{};
  var stats='<div class="stats"><div class="stat"><b>'+(s.users||0)+'</b><span>المستخدمون</span></div><div class="stat"><b>'+(s.new_today||0)+'</b><span>جدد اليوم</span></div><div class="stat"><b>'+(s.groups||0)+'</b><span>المجموعات</span></div><div class="stat"><b>'+(s.messages||0)+'</b><span>الرسائل</span></div><div class="stat"><b>'+(s.friends||0)+'</b><span>الصداقات</span></div><div class="stat"><b>'+(s.suggestions||0)+'</b><span>المقترحات</span></div></div>';
  var toggles=tgRow("signups_enabled","فتح التسجيل (دخول أعضاء جدد)")+tgRow("messaging_enabled","تفعيل المراسلة")+tgRow("groups_enabled","تفعيل المجموعات")+tgRow("public_groups_enabled","تفعيل المجموعات العامة");
  var users=(M.recent||[]).map(function(u){return '<div class="row"><div class="av">'+esc(ini(u.display_name))+'</div><div class="grow"><div class="nm">'+esc(u.display_name)+'</div><div class="mut">'+dt(u.created_at)+'</div></div></div>'}).join("")||'<div class="empty">لا مستخدمين</div>';
  var sug=(M.suggestions||[]).map(function(x){return '<div class="row"><div class="grow"><div class="nm">'+esc(x.author_name||"مجهول")+'</div><div class="mut" style="white-space:pre-wrap">'+esc(x.body)+'</div><div class="mut" style="font-size:10px;margin-top:4px">'+tm(x.created_at)+'</div></div><button class="chip" onclick="delSuggestion(\''+x.id+'\')">حذف</button></div>'}).join("")||'<div class="empty">لا مقترحات بعد</div>';
  var reps=(M.reports||[]).map(function(x){return '<div class="row"><div class="grow"><div class="nm">🚩 '+esc(x.target||"؟")+'</div><div class="mut">'+esc(x.reason||"")+' · بلّغ: '+esc(x.reporter||"؟")+'</div><div class="mut" style="font-size:10px;margin-top:4px">'+tm(x.created_at)+'</div></div><div class="acts"><button class="chip danger" onclick="blockUser(\''+x.target_id+'\',\''+esc(x.target||"").replace(/'/g,"")+'\')">حظر</button><button class="chip" onclick="closeReport(\''+x.id+'\')">إغلاق</button></div></div>'}).join("")||'<div class="empty">لا بلاغات مفتوحة ✓</div>';
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>📊 لوحة المالك</h3><span class="badge">تحكّم</span></div>'+stats+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>🚩 البلاغات</h3><span class="badge">'+((M.reports||[]).filter(function(r){return r.status!=="closed"}).length)+'</span></div>'+reps+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>⚙️ خيارات التفعيل والإغلاق</h3></div>'+toggles+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>👤 أحدث الأعضاء</h3><span class="badge">'+((M.recent||[]).length)+'</span></div>'+users+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>📋 المقترحات</h3><span class="badge">'+((M.suggestions||[]).length)+'</span></div>'+sug+'</div>';
}
window.closeReport=async function(id){ await SB.rpc("admin_close_report",{p_id:id}); await loadOwnerData(); render(); toast("أُغلق البلاغ"); };
</script>
</body>
</html>
