<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PQN — دائرتك الخاصة</title>
<meta name="theme-color" content="#0B1320"/>
<style>
:root{--navy:#0B1320;--navy3:#1c2c44;--teal:#27B8AE;--teal2:#57D7CF;--tealdeep:#0f6e56;--amber:#D9A441;--rose:#C85C5C;--bg:#F5F7F8;--surface:#fff;--surface2:#eef2f3;--text:#142033;--muted:#5f7180;--line:rgba(20,32,51,.12);--soft:0 6px 18px rgba(11,19,32,.07);--shadow:0 18px 48px rgba(11,19,32,.14);--r:12px;--font:"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;color-scheme:light}
html,body{background-color:#F5F7F8}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);min-height:100vh;background:radial-gradient(1000px 500px at 85% -10%,rgba(39,184,174,.10),transparent 60%),radial-gradient(800px 400px at -10% 110%,rgba(217,164,65,.07),transparent 55%),var(--bg)}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:100%;max-width:400px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:24px;margin-bottom:6px}
.qmark{position:relative;width:38px;height:38px;border:3px solid var(--teal);border-radius:50%;flex:0 0 auto}
.qmark::after{content:"";position:absolute;bottom:6%;left:-12%;width:38%;height:14%;border-radius:99px;background:var(--teal);transform:rotate(42deg)}
.qmark i{position:absolute;top:34%;width:14%;height:14%;border-radius:50%;background:var(--teal2)}.qmark i:first-child{right:30%}.qmark i:last-child{right:52%}
.tag{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.7}
.field{margin-bottom:14px;text-align:right}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;min-height:52px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none;font-size:16px;text-align:center}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(39,184,174,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:13px 16px;border-radius:var(--r);font-weight:800;font-size:15px;border:1px solid transparent}
.btn.full{width:100%}
.primary{background:var(--teal);color:#053a37}
.secondary{background:rgba(39,184,174,.12);color:var(--tealdeep);border-color:rgba(39,184,174,.3)}
.danger{background:rgba(200,92,92,.12);color:var(--rose)}
.hidden{display:none!important}
.priv{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#eafaf8;padding:12px 17px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;z-index:999;max-width:90%;box-shadow:var(--shadow);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.shell{display:none;max-width:520px;margin:0 auto;background:var(--surface);min-height:100vh;box-shadow:var(--shadow);position:relative}
body.in .shell{display:block}body.in .center{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(160deg,var(--navy),var(--navy3));color:#eafaf8}
.top h1{margin:0;font-size:17px}.top .sub{font-size:11px;color:#aebfca;margin-top:2px}
.grow{flex:1;min-width:0}
.body{padding:16px;padding-bottom:84px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--soft);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#053a37;background:linear-gradient(135deg,var(--teal),var(--teal2));flex:0 0 auto}
.nm{font-weight:700;font-size:14.5px}.mut{color:var(--muted);font-size:12.5px;margin-top:2px}
.pinbox{text-align:center;padding:14px}
.pin{direction:ltr;display:inline-block;padding:10px 16px;border-radius:12px;background:var(--navy);color:#eafaf8;font-weight:800;letter-spacing:2px;font-size:18px}
.strip{padding:11px 13px;border-radius:10px;background:rgba(39,184,174,.1);color:var(--tealdeep);border:1px solid rgba(39,184,174,.22);font-size:12px;line-height:1.55;margin-bottom:12px}
.field2{margin-bottom:12px}.field2 label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field2 input{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);outline:none;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px;line-height:1.7}
.shead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}.shead h3{margin:0;font-size:15px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:rgba(39,184,174,.12);color:var(--tealdeep);font-size:11px;font-weight:700}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700}
.chip.on{background:var(--teal);color:#053a37;border-color:transparent}
.chip.secondary{background:rgba(39,184,174,.12);color:var(--tealdeep);border-color:rgba(39,184,174,.3)}
.thread{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 13px;border-radius:14px 14px 14px 4px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;line-height:1.55}
.bub.me{align-self:flex-end;background:rgba(39,184,174,.14);border-color:rgba(39,184,174,.3);border-radius:14px 14px 4px 14px}
.bub .t{display:block;font-size:10px;color:var(--muted);margin-top:4px;text-align:end}
.composer{position:sticky;bottom:0;display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.composer input{border:0;outline:0;background:transparent;font-size:14px;padding:8px}
.cb{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--teal);color:#053a37}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px;background:rgba(255,255,255,.94);border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:40}
.nav button{padding:8px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:700}
.nav button.on{color:var(--tealdeep);background:rgba(39,184,174,.12)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="center" id="authView">
  <div class="auth">
    <div class="brand"><span class="qmark"><i></i><i></i></span>PQN</div>
    <p class="tag">دائرتك الخاصة، بعيدًا عن الضوضاء</p>
    <div class="field"><label>اكتب اسمك أو لقبك للدخول</label><input id="name" placeholder="مثال: خالد" maxlength="40"/></div>
    <button class="btn primary full" id="enterBtn">ادخل مباشرة</button>
    <div class="priv">🔒 بلا بريد، بلا كلمة مرور. تدخل فورًا باسمٍ فقط.<br/>رسائلك خاصة ومحميّة على مستوى قاعدة البيانات.</div>
  </div>
</div>

<div class="shell">
  <div class="top">
    <span class="qmark" style="width:30px;height:30px"><i></i><i></i></span>
    <div class="grow"><h1 id="ttl">PQN</h1><div class="sub" id="sub">دائرتك الخاصة</div></div>
    <button class="chip" id="btnRefresh" style="background:rgba(255,255,255,.12);color:#fff;border:0">تحديث</button>
  </div>
  <div class="body" id="screen"><div class="spin"></div></div>
  <nav class="nav" id="nav"></nav>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SB = createClient("https://dnocxanataaawgvdfaoj.supabase.co","sb_publishable_6bbK3b4jiarVU8iW-8z8ig_Ia5EzWCp");
const $ = function(id){return document.getElementById(id)};
const M = { me:null, profile:null, friends:[], requests:[], qids:[], screen:"friends", conv:null, friend:null, msgs:[], chan:null, booting:false };

function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){return (n||"؟").trim().slice(0,1)}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(window._t);window._t=setTimeout(function(){e.classList.remove("show")},2600)}
function tm(iso){try{return new Date(iso).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function genCode(){var c="2346789ABCDEFGHJKMNPQRTUVWXYZ",p=function(n){var s="";for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s};return "Q"+p(1)+"-"+p(4)}

$("enterBtn").onclick=enter;
$("name").addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
async function enter(){
  var name=$("name").value.trim();
  if(!name){toast("اكتب اسمك أولًا");return}
  $("enterBtn").textContent="...جارٍ الدخول"; $("enterBtn").disabled=true;
  var r=await SB.auth.signInAnonymously();
  if(r.error){
    $("enterBtn").textContent="ادخل مباشرة"; $("enterBtn").disabled=false;
    if((r.error.message||"").toLowerCase().indexOf("anonymous")>=0||r.error.status===422)
      toast("الدخول المباشر غير مفعّل بعد على الخادم. فعّله من لوحة Supabase ثم أعد المحاولة.");
    else toast("تعذّر الدخول: "+r.error.message);
    return;
  }
  try{ await SB.from("profiles").update({display_name:name}).eq("id", r.data.user.id); }catch(e){}
  await boot();
}
$("btnRefresh").onclick=function(){refreshAll()};

SB.auth.onAuthStateChange(function(_e,s){ if(s&&!M.me) boot(); else if(!s) showAuth() });
(async function(){ var r=await SB.auth.getSession(); if(r.data.session) boot(); else showAuth() })();

function showAuth(){ document.body.classList.remove("in"); $("authView").classList.remove("hidden") }
async function boot(){
  if(M.booting) return; M.booting=true;
  try{
    document.body.classList.add("in"); $("authView").classList.add("hidden");
    var u=(await SB.auth.getUser()).data.user; M.me=u;
    M.profile=await loadProfile(u.id);
    await refreshAll(true);
    M.screen="friends"; render();
  }catch(e){ toast("تعذّر تحميل البيانات: "+(e&&e.message||e)); }
  M.booting=false;
}
async function loadProfile(id){
  var r=await SB.from("profiles").select("*").eq("id",id).maybeSingle();
  if(!r.data){ await new Promise(function(x){setTimeout(x,900)}); r=await SB.from("profiles").select("*").eq("id",id).maybeSingle(); }
  return r.data || {id:id,display_name:"مستخدم",pin:"—",username:null,status:""};
}
async function refreshAll(silent){
  var f=await SB.rpc("my_friends"); M.friends=f.data||[];
  var rq=await SB.from("friend_requests").select("*").eq("recipient_id",M.me.id).eq("status","pending");
  var reqs=rq.data||[]; var ids=reqs.map(function(r){return r.requester_id});
  var profs=[]; if(ids.length){ var p=await SB.from("profiles").select("id,display_name,username").in("id",ids); profs=p.data||[]; }
  M.requests=reqs.map(function(r){ r.profile=profs.find(function(p){return p.id===r.requester_id})||{display_name:"مستخدم"}; return r });
  var q=await SB.from("q_ids").select("*").eq("owner_id",M.me.id).order("created_at",{ascending:false}); M.qids=q.data||[];
  if(!silent){ render(); toast("تم التحديث") }
}

window.addFriend=async function(){
  var h=$("handle").value.trim(); if(!h){toast("أدخل اسم مستخدم أو PIN");return}
  var r=await SB.rpc("find_profile_by_handle",{handle:h});
  if(r.error){toast("خطأ: "+r.error.message);return}
  var f=Array.isArray(r.data)?r.data[0]:r.data;
  if(!f){toast("لم يُعثر على مستخدم مطابق");return}
  if(f.id===M.me.id){toast("لا يمكنك إضافة نفسك");return}
  var ins=await SB.from("friend_requests").insert({requester_id:M.me.id,recipient_id:f.id,source:h[0]==="@"?"username":"pin"});
  if(ins.error){toast(ins.error.message.indexOf("duplicate")>=0?"الطلب مُرسَل مسبقًا":ins.error.message);return}
  $("handle").value="";toast("أُرسل طلب الصداقة ✓");
};
window.acceptReq=async function(id){ var r=await SB.rpc("accept_friend_request",{req_id:id}); if(r.error){toast(r.error.message);return} await refreshAll(); toast("تم القبول ✓") };
window.declineReq=async function(id){ await SB.from("friend_requests").update({status:"declined"}).eq("id",id); await refreshAll(); toast("تم الرفض") };
window.openChat=async function(fid){
  var fr=M.friends.find(function(f){return f.id===fid}); if(!fr)return;
  var r=await SB.rpc("get_or_create_direct_conversation",{other:fid});
  if(r.error){toast(r.error.message);return}
  M.conv=r.data; M.friend=fr;
  var ms=await SB.from("messages").select("*").eq("conversation_id",M.conv).order("created_at"); M.msgs=ms.data||[];
  await leaveChat();
  M.chan=SB.channel("conv-"+M.conv).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+M.conv},function(p){ M.msgs.push(p.new); if(M.screen==="chat") thread(); }).subscribe();
  M.screen="chat"; render();
};
async function leaveChat(){ if(M.chan){ await SB.removeChannel(M.chan); M.chan=null } }
window.sendMsg=async function(){
  var i=$("mi"),v=(i.value||"").trim(); if(!v)return; i.value="";
  var r=await SB.from("messages").insert({conversation_id:M.conv,sender_id:M.me.id,body:v,kind:"text"});
  if(r.error)toast("تعذّر الإرسال: "+r.error.message);
};
window.makeQid=async function(){
  var code=genCode();
  var r=await SB.from("q_ids").insert({owner_id:M.me.id,code:code,purpose:"add_friend",max_uses:1});
  if(r.error){toast(r.error.message);return}
  await refreshAll(); toast("Q-ID: "+code);
};
window.killQid=async function(id){ await SB.from("q_ids").update({revoked:true}).eq("id",id); await refreshAll(); toast("أُلغي Q-ID") };
window.saveProfile=async function(){
  var dn=$("pn").value.trim(), st=$("ps").value.trim();
  if(!dn){toast("الاسم مطلوب");return}
  var r=await SB.from("profiles").update({display_name:dn,status:st}).eq("id",M.me.id);
  if(r.error){toast(r.error.message);return}
  M.profile.display_name=dn; M.profile.status=st; render(); toast("تم الحفظ ✓");
};
window.copyPin=function(){ try{navigator.clipboard.writeText(M.profile.pin);toast("نُسخ الـ PIN ✓")}catch(e){toast(M.profile.pin)} };
window.signOut=async function(){ await leaveChat(); M.me=null; await SB.auth.signOut(); location.reload() };
window.go=async function(s){ if(M.screen==="chat"&&s!=="chat") await leaveChat(); M.screen=s; render() };

var NAV=[["friends","الأصدقاء"],["qid","Q-ID"],["profile","الملف"]];
function render(){
  var titles={friends:"الأصدقاء",chat:M.friend?M.friend.display_name:"محادثة",qid:"Q-ID",profile:"الملف الشخصي"};
  $("ttl").textContent=titles[M.screen]||"PQN";
  $("sub").textContent=M.screen==="chat"?"محادثة خاصة وحيّة":"دائرتك الخاصة";
  var active=M.screen==="chat"?"friends":M.screen;
  $("nav").innerHTML=NAV.map(function(n){return '<button class="'+(active===n[0]?"on":"")+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'}).join("")+'<button onclick="signOut()">خروج</button>';
  var map={friends:scrFriends,chat:scrChat,qid:scrQid,profile:scrProfile};
  $("screen").innerHTML=(map[M.screen]||scrFriends)();
  if(M.screen==="chat") thread();
}
function scrFriends(){
  var reqs=M.requests.map(function(r){return '<div class="row"><div class="av">'+esc(ini(r.profile.display_name))+'</div><div class="grow"><div class="nm">'+esc(r.profile.display_name)+'</div><div class="mut">'+esc(r.profile.username||r.source||"")+'</div></div><button class="chip on" onclick="acceptReq(\''+r.id+'\')">قبول</button><button class="chip" onclick="declineReq(\''+r.id+'\')">رفض</button></div>'}).join("");
  var fr=M.friends.length?M.friends.map(function(f){return '<div class="row"><div class="av">'+esc(ini(f.display_name))+'</div><div class="grow"><div class="nm">'+esc(f.display_name)+'</div><div class="mut">'+esc(f.username||"")+' · '+esc(f.status||"")+'</div></div><button class="chip secondary" onclick="openChat(\''+f.id+'\')">محادثة</button></div>'}).join(""):'<div class="empty">لا أصدقاء بعد. شارك رقمك (PIN) في الأسفل ليضيفك أصدقاؤك، أو أضِفهم برقمهم.</div>';
  return '<div class="card pinbox"><div class="mut" style="margin-bottom:8px">رقمك للمشاركة — اطلب من أصدقائك إضافته</div><span class="pin" onclick="copyPin()">'+esc(M.profile.pin)+'</span><div class="mut" style="margin-top:8px">اضغط الرقم لنسخه</div></div>'
    +'<div class="card"><div class="field2"><label>إضافة صديق برقمه (PIN) أو اسم مستخدمه</label><input id="handle" placeholder="مثال: 7K9M-4R2X"/></div><button class="btn primary full" onclick="addFriend()">إرسال طلب صداقة</button></div>'
    +(M.requests.length?'<div class="shead"><h3>طلبات واردة</h3><span class="badge">'+M.requests.length+'</span></div><div class="card">'+reqs+'</div>':"")
    +'<div class="shead"><h3>أصدقائي</h3><span class="badge">'+M.friends.length+'</span></div><div class="card">'+fr+'</div>';
}
function scrChat(){
  return '<button class="chip" onclick="go(\'friends\')" style="margin-bottom:10px">→ رجوع</button>'
    +'<div class="strip">🔒 محادثة فورية حقيقية عبر Realtime.</div>'
    +'<div class="thread" id="thread"></div>'
    +'<div class="composer"><input id="mi" placeholder="اكتب رسالة..." onkeydown="if(event.key===\'Enter\')sendMsg()"/><button class="cb" onclick="sendMsg()">➤</button></div>';
}
function thread(){
  var el=$("thread"); if(!el)return;
  el.innerHTML=M.msgs.map(function(m){var mine=m.sender_id===M.me.id;return '<div class="bub '+(mine?"me":"")+'">'+esc(m.body)+'<span class="t">'+tm(m.created_at)+(mine?" ✓":"")+'</span></div>'}).join("")||'<div class="empty">لا رسائل بعد. ابدأ المحادثة 🌿</div>';
  el.scrollIntoView({block:"end"});
}
function scrQid(){
  var list=M.qids.filter(function(q){return !q.revoked}).map(function(q){return '<div class="row"><div class="av">QR</div><div class="grow"><div class="nm" style="direction:ltr">'+esc(q.code)+'</div><div class="mut">'+esc(q.purpose)+' · '+q.max_uses+' استخدام</div></div><button class="chip" onclick="killQid(\''+q.id+'\')">إلغاء</button></div>'}).join("")||'<div class="empty">لا هويات نشطة</div>';
  return '<div class="strip">🪪 هوية مؤقتة تشاركها بدل رقمك الدائم.</div>'
    +'<button class="btn primary full" onclick="makeQid()" style="margin-bottom:12px">إنشاء Q-ID جديد</button>'
    +'<div class="card">'+list+'</div>';
}
function scrProfile(){
  var p=M.profile;
  return '<div class="card" style="text-align:center"><div class="av" style="width:80px;height:80px;font-size:30px;margin:0 auto 12px">'+esc(ini(p.display_name))+'</div>'
    +'<div class="nm" style="font-size:19px">'+esc(p.display_name)+'</div><div class="mut">'+esc(p.status||"")+'</div>'
    +'<div style="margin-top:12px"><span class="pin" onclick="copyPin()">'+esc(p.pin)+'</span></div></div>'
    +'<div class="card"><div class="field2"><label>اسم العرض</label><input id="pn" value="'+esc(p.display_name)+'"/></div>'
    +'<div class="field2"><label>الحالة</label><input id="ps" value="'+esc(p.status||"")+'"/></div>'
    +'<button class="btn primary full" onclick="saveProfile()">حفظ</button></div>'
    +'<button class="btn danger full" onclick="signOut()">تسجيل الخروج</button>';
}
</script>
</body>
</html>
