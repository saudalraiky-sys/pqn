<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PQN — دائرتك الخاصة</title>
<meta name="theme-color" content="#0B1320"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
:root{--navy:#0B1320;--navy2:#122236;--navy3:#1c2c44;--teal:#27B8AE;--teal2:#57D7CF;--tealdeep:#0f6e56;--amber:#D9A441;--rose:#C85C5C;--bg:#eef3f4;--surface:#fff;--surface2:#f0f5f5;--text:#142033;--muted:#5f7180;--line:rgba(20,32,51,.1);--soft:0 6px 20px rgba(11,19,32,.06);--shadow:0 20px 50px rgba(11,19,32,.16);--r:14px;--font:"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;color-scheme:light}
body.dark{--bg:#0a1521;--surface:#10202f;--surface2:#16293a;--text:#e9f3f3;--muted:#9fb3bf;--line:rgba(233,243,243,.12);--soft:0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
html,body{background-color:var(--bg)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);min-height:100vh;background:radial-gradient(1100px 540px at 88% -12%,rgba(39,184,174,.13),transparent 60%),radial-gradient(820px 420px at -12% 112%,rgba(217,164,65,.08),transparent 55%),var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:100%;max-width:400px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:900;font-size:26px;margin-bottom:6px}
.qmark{position:relative;width:40px;height:40px;border:3px solid var(--teal);border-radius:50%;flex:0 0 auto}
.qmark::after{content:"";position:absolute;bottom:6%;left:-12%;width:38%;height:14%;border-radius:99px;background:var(--teal);transform:rotate(42deg)}
.qmark i{position:absolute;top:34%;width:14%;height:14%;border-radius:50%;background:var(--teal2)}.qmark i:first-child{right:30%}.qmark i:last-child{right:52%}
.tag{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.7}
.field{margin-bottom:14px;text-align:right}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;min-height:54px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);outline:none;font-size:16px;text-align:center;box-shadow:var(--soft)}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(39,184,174,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 16px;border-radius:var(--r);font-weight:800;font-size:15px;border:1px solid transparent}
.btn.full{width:100%}
.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#053a37;box-shadow:0 10px 24px rgba(39,184,174,.32)}
.primary:active{transform:translateY(1px)}
.secondary{background:rgba(39,184,174,.12);color:var(--tealdeep);border-color:rgba(39,184,174,.3)}
.hidden{display:none!important}
.priv{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.8}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#eafaf8;padding:12px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:.25s;z-index:999;max-width:90%;box-shadow:var(--shadow);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.shell{display:none;max-width:520px;margin:0 auto;background:var(--surface);min-height:100vh;box-shadow:var(--shadow);position:relative}
body.in .shell{display:flex;flex-direction:column;height:100dvh}body.in .center{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(155deg,var(--navy),var(--navy3));color:#eafaf8}
.top h1{margin:0;font-size:17px}.top .sub{font-size:11px;color:#aebfca;margin-top:2px}
.grow{flex:1;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#bfeee8;background:rgba(39,184,174,.18);padding:6px 11px;border-radius:99px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--teal2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(87,215,207,.5)}70%{box-shadow:0 0 0 7px rgba(87,215,207,0)}100%{box-shadow:0 0 0 0 rgba(87,215,207,0)}}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;padding-bottom:92px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--soft);padding:14px;margin-bottom:12px}
.greet{font-size:18px;font-weight:800;margin:2px 2px 12px}.greet span{color:var(--tealdeep)}
.hero{background:linear-gradient(150deg,var(--navy2),var(--navy3));color:#eafaf8;border:0;text-align:center;padding:18px}
.hero .lbl{font-size:12px;color:#a9bccb;margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#053a37;background:linear-gradient(135deg,var(--teal),var(--teal2));flex:0 0 auto}
.av.g{background:linear-gradient(135deg,var(--amber),#eac374);color:#5a3d05}
.nm{font-weight:700;font-size:14.5px}.mut{color:var(--muted);font-size:12.5px;margin-top:2px}
.pin{direction:ltr;display:inline-block;padding:11px 18px;border-radius:12px;background:rgba(255,255,255,.12);color:#eafaf8;font-weight:800;letter-spacing:2px;font-size:19px;cursor:pointer}
.strip{padding:11px 13px;border-radius:10px;background:rgba(39,184,174,.1);color:var(--tealdeep);border:1px solid rgba(39,184,174,.22);font-size:12px;line-height:1.55;margin-bottom:12px}
.warn{background:rgba(217,164,65,.14);color:#7a560a;border-color:rgba(217,164,65,.3)}
body.dark .warn{color:#ffd98a}
.field2{margin-bottom:12px}.field2 label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field2 input,.field2 textarea,.field2 select{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);outline:none;font-size:15px}
.field2 textarea{resize:vertical;min-height:80px;line-height:1.6}
.field2 input:focus,.field2 textarea:focus,.field2 select:focus{border-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13.5px;line-height:1.7}
.shead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.shead h3{margin:0;font-size:15px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:rgba(39,184,174,.12);color:var(--tealdeep);font-size:11px;font-weight:700}
.acts{display:flex;gap:6px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:36px;min-width:36px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.chip.on{background:var(--teal);color:#053a37;border-color:transparent}
.chip.secondary{background:rgba(39,184,174,.12);color:var(--tealdeep);border-color:rgba(39,184,174,.3)}
.chip.ping{background:rgba(217,164,65,.16);border-color:rgba(217,164,65,.34);font-size:15px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px rgba(39,184,174,.45)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--tealdeep)}.stat span{font-size:10.5px;color:var(--muted)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.tg:last-child{border-bottom:0}
.sw{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.sw.on{background:var(--teal)}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{right:22px}
.thread{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:8px 13px 10px;border-radius:14px 14px 14px 4px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;line-height:1.55}
.bub.me{align-self:flex-end;background:rgba(39,184,174,.14);border-color:rgba(39,184,174,.3);border-radius:14px 14px 4px 14px}
.bub .sn{display:block;font-size:10.5px;font-weight:700;color:var(--tealdeep);margin-bottom:2px}
.bub .t{display:block;font-size:10px;color:var(--muted);margin-top:4px;text-align:end}
.pingmsg{align-self:center;background:rgba(217,164,65,.15);color:#7a560a;border:1px solid rgba(217,164,65,.3);padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700}
body.dark .pingmsg{color:#ffd98a}
.composer{display:flex;align-items:center;gap:6px;margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.composer input{border:0;outline:0;background:transparent;font-size:14px;padding:8px;min-width:0;flex:1 1 auto}
.cb.mini{width:38px;height:38px;background:var(--surface2);color:var(--text);font-size:18px;flex:0 0 auto}
.composer .cb{width:40px;height:40px;font-size:17px}
.composer .cb.mini{width:36px;height:36px;font-size:17px}
body.recording .cb.rec{background:var(--rose);color:#fff;animation:pulse 1.1s infinite}
.emoji{display:none;flex-wrap:wrap;gap:3px;max-height:150px;overflow-y:auto;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
.emoji.show{display:flex}
.emoji button{font-size:21px;background:none;border:0;padding:4px;line-height:1;cursor:pointer}
.imgmsg img{max-width:210px;max-height:260px;border-radius:10px;display:block;cursor:pointer}
.voicebtn{background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.34);border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px;color:#7a560a}
body.dark .voicebtn{color:#ffd98a}
.chatwrap{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:0 0 auto}
.chatwrap .thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:6px}
.chatwrap .composer{flex:0 0 auto;margin:6px 0 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.cb{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--teal);color:#053a37;font-size:18px}
.cb.ghost{background:rgba(217,164,65,.16);color:#7a560a}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;gap:2px;padding:8px;background:var(--surface);border-top:1px solid var(--line);z-index:40}
.nav button{padding:9px 1px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:700}
.nav button.on{color:var(--tealdeep);background:rgba(39,184,174,.12)}
.banner{position:fixed;left:50%;top:10px;transform:translateX(-50%) translateY(-130%);width:calc(100% - 24px);max-width:496px;z-index:200;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--navy);color:#eafaf8;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s;border:1px solid rgba(87,215,207,.3)}
.banner.show{transform:translateX(-50%) translateY(0)}
.banner .bt{font-weight:800;font-size:13px}
.banner .bb{font-size:12px;color:#bcd3da;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.banner .bi{font-size:22px;flex:0 0 auto}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(7,19,31,.55)}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px;box-shadow:var(--shadow);animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(50px);opacity:.5}to{transform:translateY(0);opacity:1}}
.handle{width:44px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.btn.soft{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.row .nm{cursor:pointer}
.row[onclick]{cursor:pointer}
.addbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--soft);padding:7px;margin-bottom:14px}
.addbar input{border:0;outline:0;background:transparent;font-size:14px;padding:11px;min-width:0}
.addbar .cb{width:44px;height:44px;font-size:24px}
.qstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.qs{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--soft);color:var(--text)}
.qs b{font-size:21px;color:var(--tealdeep);line-height:1}
.qs span{font-size:11px;color:var(--muted)}
.qs.alert{border-color:rgba(217,164,65,.4);background:rgba(217,164,65,.08)}
.qs.alert b{color:var(--amber)}
.row,.tile,.qs,.chip,.btn,.swatch{transition:transform .08s ease}
.row:active,.tile:active,.qs:active,.chip:active,.btn:active{transform:scale(.97)}
body.chatting .nav{display:none}
body.chatting .body{overflow:hidden;padding:12px 14px 0}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<script type="module">

const ACCENTS={teal:["#27B8AE","#57D7CF","#0f6e56"],blue:["#3B82F6","#7DA9FB","#1E3A8A"],amber:["#D9A441","#EAC374","#8A5B00"],rose:["#C85C5C","#E08A8A","#7E3030"],green:["#3FA37C","#74C7A0","#1F6E4E"],purple:["#8B5CF6","#B49BFA","#4C2E91"]};

window.toggleVoice=async function(){
  if(!flag("messaging_enabled")){toast("المراسلة معطّلة مؤقتًا");return}

    _chunks=[]; _rec=new MediaRecorder(stream);

    _rec.onstop=async function(){ try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){} document.body.classList.remove("recording"); var blob=new Blob(_chunks,{type:"audio/webm"}); if(blob.size<500){toast("التسجيل قصير جدًا");return} toast("...جارٍ رفع الصوت"); var path=M.conv+"/"+M.me.id+"-"+Date.now()+".webm"; var up=await SB.storage.from("media").upload(path,blob,{contentType:"audio/webm"}); if(up.error){toast("تعذّر الرفع: "+up.error.message);return} var url=SB.storage.from("media").getPublicUrl(path).data.publicUrl; var r=await SB.from("messages").insert({conversation_id:M.conv,sender_id:M.me.id,body:url,kind:"voice"}); if(r.error)toast("تعذّر الإرسال: "+r.error.message); };
    _rec.start(); audioCtx(); document.body.classList.add("recording"); buzz([30]); toast("🎤 جارٍ التسجيل... اضغط 🎤 مجددًا للإرسال");
  }catch(e){ toast("تعذّر الوصول للميكروفون — اسمح بالإذن"); }

async function boot(){

    var u=(await SB.auth.getUser()).data.user; M.me=u;
    M.profile=await loadProfile(u.id);

async function loadProfile(id){ var r=await SB.from("profiles").select("*").eq("id",id).maybeSingle(); if(!r.data){ await new Promise(function(x){setTimeout(x,900)}); r=await SB.from("profiles").select("*").eq("id",id).maybeSingle(); } return r.data || {id:id,display_name:"مستخدم",pin:"—",status:""}; }
async function refreshAll(silent){
  var f=await SB.rpc("my_friends"); M.friends=f.data||[];
  var rq=await SB.from("friend_requests").select("*").eq("recipient_id",M.me.id).eq("status","pending");
  var reqs=rq.data||[]; var ids=reqs.map(function(r){return r.requester_id}); var profs=[];
  if(ids.length){ var p=await SB.from("profiles").select("id,display_name,username").in("id",ids); profs=p.data||[]; }
  M.requests=reqs.map(function(r){ r.profile=profs.find(function(p){return p.id===r.requester_id})||{display_name:"مستخدم"}; return r });
  var q=await SB.from("q_ids").select("*").eq("owner_id",M.me.id).order("created_at",{ascending:false}); M.qids=q.data||[];
  var sig=M.friends.length+"/"+M.requests.length+"/"+M.qids.length; var changed=(sig!==M.sig); M.sig=sig;
  if(!silent){ render(); toast("تم التحديث"); }
  else if(M.screen==="friends"||M.screen==="qid"){ var h=$("handle"); if(h && document.activeElement===h) return; var hv=h?h.value:null; render(); var h2=$("handle"); if(hv && h2) h2.value=hv; }

function startLive(){
  if(M.live) return;
  M.live=SB.channel("live-"+M.me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"recipient_id=eq."+M.me.id},function(){ var n=M.requests.length; refreshAll(true).then(function(){ if(M.requests.length>n){ buzz(); toast("📬 طلب صداقة جديد"); notify("PQN","📬 طلب صداقة جديد"); } }); })
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"requester_id=eq."+M.me.id},function(){ refreshAll(true); })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){ var m=p.new; if(m.sender_id===M.me.id) return; if(M.screen==="chat"&&m.conversation_id===M.conv) return; var fr=M.friends.find(function(x){return x.id===m.sender_id}); var who=(fr&&fr.display_name)||"رسالة"; if(m.kind==="ping"){ pingAlert(); inAppNote("📳 "+who, "نبّهك بتنبيه", m.conversation_id, who); notify(who,"📳 نبّهك"); } else { buzz([45]); playBlip(); var prev=m.kind==="image"?"📷 صورة":(m.kind==="voice"?"🎤 رسالة صوتية (مرة واحدة)":(m.body||"رسالة جديدة")); inAppNote("📨 "+who, prev, m.conversation_id, who); notify(who, prev); } })
    .subscribe();
  if(!M.poll) M.poll=setInterval(autoTick, 7000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && M.me) autoTick(); });
}
function autoTick(){
  if(!M.me || M.screen==="chat") return;
  refreshAll(true);
  if(M.screen==="groups"){ loadGroups().then(function(){ var a=document.activeElement; if(a&&(a.id==="gname"||a.id==="gdesc"||a.id==="gpriv")) return; render(); }); }
}

async function openConv(conv, name, isGroup){
  M.conv=conv; M.friend={display_name:name}; M.isGroup=isGroup; M.members={};
  if(isGroup){ try{ var mm=await SB.from("conversation_members").select("user_id").eq("conversation_id",conv); var ids=(mm.data||[]).map(function(x){return x.user_id}); if(ids.length){ var pr=await SB.from("profiles").select("id,display_name").in("id",ids); (pr.data||[]).forEach(function(p){M.members[p.id]=p.display_name}); } }catch(e){} }
  var ms=await SB.from("messages").select("*").eq("conversation_id",conv).order("created_at"); M.msgs=ms.data||[];
  await leaveChat();
  M.chan=SB.channel("conv-"+conv)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+conv},function(p){ M.msgs.push(p.new); if(p.new.sender_id!==M.me.id){ if(p.new.kind==="ping"){ pingAlert(); } else { playBlip(); buzz([30]); } if(document.hidden) notify(M.friend?M.friend.display_name:"PQN", p.new.kind==="ping"?"📳 نبّهك":(p.new.kind==="image"?"📷 صورة":(p.new.kind==="voice"?"🎤 رسالة صوتية":(p.new.body||"")))); } if(M.screen==="chat") thread(); })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},function(p){ var id=p.old&&p.old.id; if(!id)return; var n=M.msgs.length; M.msgs=M.msgs.filter(function(x){return x.id!==id}); if(M.msgs.length!==n && M.screen==="chat") thread(); })
    .subscribe();
  M.screen="chat"; render();
}

(function(){ var sx=0,sy=0,st=0,active=false;
  document.addEventListener("touchstart",function(e){ if(!document.body.classList.contains("in"))return; var t=e.touches[0]; var w=window.innerWidth; if(t.clientX<38||t.clientX>w-38){ sx=t.clientX;sy=t.clientY;st=Date.now();active=true; } else active=false; },{passive:true});
  document.addEventListener("touchend",function(e){ if(!active)return; active=false; var t=e.changedTouches[0]; var dx=t.clientX-sx,dy=t.clientY-sy; if(Date.now()-st<650 && Math.abs(dx)>70 && Math.abs(dy)<55){ if($("modal")&&$("modal").classList.contains("show")){ closeModal(); return; } if(M.screen!=="friends") goBack(); } },{passive:true});
})();
window.refreshNow=async function(){ await refreshAll(false); };
function greetWord(){ var h=new Date().getHours(); return h<12?"صباح الخير":(h<17?"نهارك سعيد":"مساء الخير"); }

function navItems(){ var n=[["friends","الرئيسية"]]; if(flag("groups_enabled")) n.push(["groups","مجموعات"]); n.push(["qid","Q-ID"]); n.push(["profile","الملف"]); n.push(["settings","إعدادات"]); return n; }
function backBtn(){ return '<button class="chip" onclick="goBack()" style="margin-bottom:12px">→ رجوع</button>'; }
function render(){
  document.body.classList.toggle("chatting", M.screen==="chat");
  var titles={friends:"الرئيسية",groups:"المجموعات",chat:M.friend?M.friend.display_name:"محادثة",qid:"Q-ID",profile:"الملف",settings:"الإعدادات"};
  $("ttl").textContent=titles[M.screen]||"PQN";
  $("sub").textContent=M.screen==="chat"?(M.isGroup?"مجموعة":"محادثة خاصة"):"دائرتك الخاصة";
  var active=M.screen==="chat"?"friends":M.screen; var items=navItems();
  var nav=$("nav"); nav.style.gridTemplateColumns="repeat("+items.length+",1fr)";
  nav.innerHTML=items.map(function(n){return '<button class="'+(active===n[0]?"on":"")+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'}).join("");
  var map={friends:scrFriends,groups:scrGroups,chat:scrChat,qid:scrQid,profile:scrProfile,settings:scrSettings};
  $("screen").innerHTML=(map[M.screen]||scrFriends)();
  if(M.screen==="chat") thread();
}
function scrFriends(){
  var reqs=M.requests.map(function(r){return '<div class="row"><div class="av">'+esc(ini(r.profile.display_name))+'</div><div class="grow"><div class="nm">'+esc(r.profile.display_name)+'</div><div class="mut">'+esc(r.profile.username||r.source||"")+'</div></div><div class="acts"><button class="chip on" onclick="acceptReq(\''+r.id+'\')">قبول</button><button class="chip" onclick="declineReq(\''+r.id+'\')">رفض</button></div></div>'}).join("");
  var fr=M.friends.length?M.friends.map(function(f){return '<div class="row" onclick="openChat(\''+f.id+'\')"><div class="av">'+esc(ini(f.display_name))+'</div><div class="grow"><div class="nm" onclick="event.stopPropagation();friendDetails(\''+f.id+'\')">'+esc(f.display_name)+'</div><div class="mut">'+(f.username?'@'+esc(f.username)+(f.status?' · ':''):'')+esc(f.status||"")+'</div></div><button class="chip ping" onclick="event.stopPropagation();pingFriend(\''+f.id+'\')" title="تنبيه">📳</button></div>'}).join(""):'<div class="empty">لا أصدقاء بعد. شارك اسمك المميّز @ أو رقمك (PIN) ليضيفك أصدقاؤك، أو أضِفهم.</div>';
  return '<div class="addbar"><input id="handle" placeholder="أضف صديقًا: @اسمه أو رقمه (PIN)" onkeydown="if(event.key===\'Enter\')addFriend()"/><button class="cb" onclick="addFriend()" title="إضافة">+</button></div>'
    +'<div class="greet">'+greetWord()+'، <span>'+esc(M.profile.display_name)+'</span> 👋</div>'
    +'<div class="qstats">'
      +'<button class="qs" onclick="go(\'qid\')"><b>'+M.friends.length+'</b><span>أصدقاء</span></button>'
      +'<button class="qs '+(M.requests.length?'alert':'')+'" onclick="refreshNow()"><b>'+M.requests.length+'</b><span>طلبات</span></button>'
      +'<button class="qs" onclick="refreshNow()"><b>🔄</b><span>تحديث</span></button>'
    +'</div>'
    +(M.requests.length?'<div class="shead" style="margin-top:4px"><h3>طلبات واردة</h3><span class="badge">'+M.requests.length+'</span></div><div class="card">'+reqs+'</div>':"")
    +'<div class="shead"><h3>أصدقائي</h3><span class="badge">'+M.friends.length+'</span></div><div class="card">'+fr+'</div>';
}
function scrGroups(){
  if(!flag("groups_enabled")) return '<div class="strip warn">المجموعات معطّلة حاليًا من قِبل المالك.</div>';
  var mine=M.groups.length?M.groups.map(function(g){var ns=esc(g.name).replace(/'/g,"");return '<div class="row" onclick="openGroup(\''+g.conversation_id+'\',\''+ns+'\')"><div class="av g">'+esc(ini(g.name))+'</div><div class="grow"><div class="nm" onclick="event.stopPropagation();groupDetails(\''+g.conversation_id+'\')">'+esc(g.name)+'</div><div class="mut">'+(g.privacy==="public"?"عامة":"خاصة")+' · '+g.members+' عضو</div></div><span class="chip secondary">فتح</span></div>'}).join(""):'<div class="empty">لست في أي مجموعة بعد.</div>';
  var pubOpt = flag("public_groups_enabled") ? '<option value="public">عامة — يراها الجميع وينضمون</option>' : '';
  var create='<div class="card"><div class="shead" style="margin-top:0"><h3>إنشاء مجموعة</h3></div>'
    +'<div class="field2"><label>اسم المجموعة</label><input id="gname" placeholder="مثال: نادي الكتاب"/></div>'
    +'<div class="field2"><label>الخصوصية</label><select id="gpriv"><option value="private">خاصة — بالدعوة فقط</option>'+pubOpt+'</select></div>'
    +'<div class="field2"><label>وصف (اختياري)</label><input id="gdesc" placeholder="وصف مختصر"/></div>'
    +'<button class="btn primary full" onclick="createGroup()">إنشاء المجموعة</button></div>';
  var pub="";
  if(flag("public_groups_enabled")){
    var rows=M.pubGroups.length?M.pubGroups.map(function(g){var nmeName=esc(g.name).replace(/'/g,"");var act=g.joined?("openGroup('"+g.conversation_id+"','"+nmeName+"')"):("joinAndOpen('"+g.id+"','"+nmeName+"')");return '<div class="row" onclick="'+act+'"><div class="av g">'+esc(ini(g.name))+'</div><div class="grow"><div class="nm" onclick="event.stopPropagation();groupDetails(\''+g.conversation_id+'\')">'+esc(g.name)+'</div><div class="mut">'+esc(g.description||"")+' · '+g.members+' عضو</div></div>'+(g.joined?'<span class="chip secondary">فتح</span>':'<span class="chip on">انضمام</span>')+'</div>'}).join(""):'<div class="empty">لا مجموعات عامة بعد. أنشئ واحدة!</div>';
    pub='<div class="shead"><h3>مجموعات عامة</h3><span class="badge">'+M.pubGroups.length+'</span></div><div class="card">'+rows+'</div>';
  }
  return backBtn()+'<div class="shead" style="margin-top:0"><h3>مجموعاتي</h3><span class="badge">'+M.groups.length+'</span></div><div class="card">'+mine+'</div>'+create+pub;
}
function scrChat(){
  return '<div class="chatwrap">'
    +'<div class="chathead"><button class="chip" onclick="go(\'friends\')">→ رجوع</button><div class="strip" style="margin:0;flex:1">🔒 '+(M.isGroup?"مجموعة":"محادثة خاصة")+' · 📳 تنبيه · 🎤 صوت يُسمع مرة واحدة</div></div>'
    +'<div class="thread" id="thread"></div>'
    +'<div class="emoji" id="emoji">'+EMO.map(function(e){return '<button onclick="addEmoji(\''+e+'\')">'+e+'</button>'}).join("")+'</div>'
    +'<div class="composer">'
      +'<button class="cb mini" onclick="toggleEmoji()" title="إيموجي">😊</button>'
      +'<button class="cb mini" onclick="pickImage()" title="صورة">📷</button>'
      +'<button class="cb mini rec" onclick="toggleVoice()" title="رسالة صوتية">🎤</button>'
      +'<input id="mi" placeholder="اكتب رسالة..." onkeydown="if(event.key===\'Enter\')sendMsg()"/>'
      +'<button class="cb ghost" onclick="pingInChat()" title="تنبيه">📳</button>'
      +'<button class="cb" onclick="sendMsg()">➤</button>'
    +'</div>'
    +'<input type="file" id="imgInput" accept="image/*" style="display:none" onchange="onImagePicked(event)"/>'
    +'</div>';
}
function thread(){
  var el=$("thread"); if(!el)return;
  el.innerHTML=M.msgs.map(function(m){
    var mine=m.sender_id===M.me.id;
    if(m.kind==="ping"){return '<div class="pingmsg">📳 '+(mine?"أرسلتَ تنبيهًا":"نبّهك")+' · '+tm(m.created_at)+'</div>'}
    var sn=(M.isGroup&&!mine)?'<span class="sn">'+esc(M.members[m.sender_id]||"عضو")+'</span>':'';
    if(m.kind==="image"){ return '<div class="bub imgmsg '+(mine?"me":"")+'">'+sn+'<img src="'+esc(m.body)+'" onclick="window.open(this.src,\'_blank\')"/><span class="t">'+tm(m.created_at)+(mine?" ✓":"")+'</span></div>'; }
    if(m.kind==="voice"){ var inner = mine ? '🎤 رسالة صوتية · تُسمع مرة واحدة' : '<button class="voicebtn" onclick="playVoice(\''+m.id+'\',this)">🎤 استمع (مرة واحدة)</button>'; return '<div class="bub '+(mine?"me":"")+'">'+sn+inner+'<span class="t">'+tm(m.created_at)+(mine?" ✓":"")+'</span></div>'; }
    return '<div class="bub '+(mine?"me":"")+'">'+sn+esc(m.body)+'<span class="t">'+tm(m.created_at)+(mine?" ✓":"")+'</span></div>'
  }).join("")||'<div class="empty">لا رسائل بعد. ابدأ المحادثة 🌿</div>';
  el.scrollTop=el.scrollHeight;
}
function scrQid(){
  var list=M.qids.filter(function(q){return !q.revoked}).map(function(q){return '<div class="row"><div class="av">🪪</div><div class="grow"><div class="nm" style="direction:ltr;cursor:pointer" onclick="copyText(\''+esc(q.code)+'\')">'+esc(q.code)+'</div><div class="mut">اضغط للنسخ · صالح 30 يومًا</div></div><button class="chip" onclick="killQid(\''+q.id+'\')">إلغاء</button></div>'}).join("")||'<div class="empty">لا هويات نشطة. أنشئ واحدة وشاركها.</div>';
  return backBtn()+'<div class="strip">🪪 أنشئ كودًا تشاركه مع من تريد إضافته. يكتبه في خانة «إضافة صديق» في صفحته الرئيسية فيصلك طلب صداقة. بديل أنيق عن مشاركة رقمك الدائم.</div><button class="btn primary full" onclick="makeQid()" style="margin-bottom:12px">إنشاء Q-ID جديد</button><div class="card">'+list+'</div>';
}
function scrProfile(){
  var p=M.profile;
  return backBtn()+'<div class="card" style="text-align:center"><div class="av" style="width:82px;height:82px;font-size:32px;margin:0 auto 12px">'+esc(ini(p.display_name))+'</div><div class="nm" style="font-size:19px">'+esc(p.display_name)+'</div><div class="mut" style="direction:ltr;cursor:pointer;color:var(--tealdeep);font-weight:700" onclick="copyText(\'@'+esc(p.username||"")+'\')">@'+esc(p.username||"")+'</div><div class="mut" style="margin-top:4px">'+esc(p.status||"")+'</div><div style="margin-top:12px"><span class="pin" style="background:var(--navy);color:#eafaf8" onclick="copyPin()">'+esc(p.pin)+'</span></div></div>'
    +'<div class="card"><div class="field2"><label>اسم العرض</label><input id="pn" value="'+esc(p.display_name)+'"/></div><div class="field2"><label>الحالة</label><input id="ps" value="'+esc(p.status||"")+'"/></div><button class="btn primary full" onclick="saveProfile()">حفظ</button></div>';
}
function scrSettings(){
  var dark=localStorage.getItem("pqn_dark")==="1"; var a=localStorage.getItem("pqn_accent")||"teal";
  var sw=Object.keys(ACCENTS).map(function(k){return '<button class="swatch'+(a===k?" on":"")+'" style="background:'+ACCENTS[k][0]+'" onclick="setAccent(\''+k+'\')"></button>'}).join("");
  return backBtn()+'<div class="card" style="text-align:center"><div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:10px"><span class="qmark" style="width:38px;height:38px"><i></i><i></i></span><div style="font-weight:900;font-size:18px">ثبّت PQN</div></div><div class="mut" style="margin-bottom:12px;line-height:1.7">أضِف التطبيق إلى شاشتك الرئيسية ليفتح كتطبيق مستقلّ بأيقونته الخاصة.</div><button class="btn primary full" onclick="installApp()">📲 تثبيت على الشاشة الرئيسية</button></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>المظهر</h3></div><div class="mut" style="margin-bottom:8px">الوضع</div><div class="acts" style="margin-bottom:16px"><button class="chip '+(!dark?"on":"")+'" onclick="setDark(false)">فاتح ☀️</button><button class="chip '+(dark?"on":"")+'" onclick="setDark(true)">داكن 🌙</button></div><div class="mut" style="margin-bottom:10px">اللون</div><div class="swatches">'+sw+'</div></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>الإشعارات</h3></div><div class="mut" style="margin-bottom:12px;line-height:1.7">فعّل الإشعارات لتصلك التنبيهات حتى عند إغلاق التطبيق.<br/>على آيفون: أضِف التطبيق للشاشة الرئيسية أولًا.</div><button class="btn secondary full" onclick="enableNotifs()">تفعيل الإشعارات على هذا الجهاز</button></div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>أرسل اقتراحًا 💡</h3></div><div class="field2"><textarea id="sg" placeholder="اكتب اقتراحك لتحسين التطبيق..."></textarea></div><button class="btn primary full" onclick="sendSuggestion()">إرسال الاقتراح</button></div>'
    +(M.owner?ownerPanel():ownerLogin());
}
function ownerLogin(){
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>دخول المالك 🔑</h3></div><div class="mut" style="margin-bottom:10px">خاص بمالك التطبيق للتحكّم والاطّلاع على المقترحات.</div><div class="field2"><input id="oe" type="email" placeholder="البريد"/></div><div class="field2"><input id="op" type="password" placeholder="كلمة المرور"/></div><button class="btn secondary full" onclick="ownerLoginGo()">دخول</button></div>';
}
function tgRow(k,label){ return '<div class="tg"><div><div class="nm" style="font-size:13.5px">'+label+'</div></div><div class="sw '+(flag(k)?"on":"")+'" onclick="toggleFlag(\''+k+'\')"></div></div>'; }
function ownerPanel(){
  var s=M.stats||{};
  var stats='<div class="stats"><div class="stat"><b>'+(s.users||0)+'</b><span>المستخدمون</span></div><div class="stat"><b>'+(s.new_today||0)+'</b><span>جدد اليوم</span></div><div class="stat"><b>'+(s.groups||0)+'</b><span>المجموعات</span></div><div class="stat"><b>'+(s.messages||0)+'</b><span>الرسائل</span></div><div class="stat"><b>'+(s.friends||0)+'</b><span>الصداقات</span></div><div class="stat"><b>'+(s.suggestions||0)+'</b><span>المقترحات</span></div></div>';
  var toggles=tgRow("signups_enabled","فتح التسجيل (دخول أعضاء جدد)")+tgRow("messaging_enabled","تفعيل المراسلة")+tgRow("groups_enabled","تفعيل المجموعات")+tgRow("public_groups_enabled","تفعيل المجموعات العامة");
  var users=(M.recent||[]).map(function(u){return '<div class="row"><div class="av">'+esc(ini(u.display_name))+'</div><div class="grow"><div class="nm">'+esc(u.display_name)+'</div><div class="mut">'+dt(u.created_at)+'</div></div></div>'}).join("")||'<div class="empty">لا مستخدمين</div>';
  var sug=(M.suggestions||[]).map(function(x){return '<div class="row"><div class="grow"><div class="nm">'+esc(x.author_name||"مجهول")+'</div><div class="mut" style="white-space:pre-wrap">'+esc(x.body)+'</div><div class="mut" style="font-size:10px;margin-top:4px">'+tm(x.created_at)+'</div></div><button class="chip" onclick="delSuggestion(\''+x.id+'\')">حذف</button></div>'}).join("")||'<div class="empty">لا مقترحات بعد</div>';
  return '<div class="card"><div class="shead" style="margin-top:0"><h3>📊 لوحة المالك</h3><span class="badge">تحكّم</span></div>'+stats+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>⚙️ خيارات التفعيل والإغلاق</h3></div>'+toggles+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>👤 أحدث الأعضاء</h3><span class="badge">'+((M.recent||[]).length)+'</span></div>'+users+'</div>'
    +'<div class="card"><div class="shead" style="margin-top:0"><h3>📋 المقترحات</h3><span class="badge">'+((M.suggestions||[]).length)+'</span></div>'+sug+'</div>';
}
</script>
</body>
</html>
